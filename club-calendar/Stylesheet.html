<style>
/* =========================================================
   部活カレンダー スタイル
   - 色や大きさの調整はこのファイルを触ればOK
   - :root の変数を変えると全体のトーンが変わります
   ========================================================= */
:root {
  --bg:        #ffffff;
  --panel:     #ffffff;
  --line:      #cfd4dc;   /* 罫線（薄いグレー） */
  --text:      #222222;
  --muted:     #8a94a6;
  --sun:       #e8281e;   /* 日曜・祝日（赤） */
  --sat:       #2b5ed6;   /* 土曜（青） */
  --wd-bg:     #ededed;   /* 平日の曜日見出し背景 */
  --accent:    #4f86ff;
}

* { box-sizing: border-box; }
body {
  margin: 0;
  /* フォントはヒラギノ丸ゴを優先（無い端末は丸ゴ系→標準ゴシックにフォールバック） */
  font-family: 'Hiragino Maru Gothic ProN', 'Hiragino Maru Gothic Pro', 'ヒラギノ丸ゴ ProN W4',
               'Hiragino Sans', 'Yu Gothic', 'Meiryo', sans-serif;
  background: var(--bg);
  color: var(--text);
  -webkit-text-size-adjust: 100%;
}
#app { max-width: 1100px; margin: 0 auto; padding: 12px; }

/* ===== ヘッダー（8 August ...... 2026） ===== */
.cal-header { padding: 8px 2px 12px; }
.cal-toolbar {
  display: flex; justify-content: flex-end; align-items: center;
  gap: 8px; margin-bottom: 6px;
}
.nav-btn {
  width: 36px; height: 36px; border: 1px solid var(--line);
  background: #fff; border-radius: 9px; font-size: 20px;
  cursor: pointer; color: var(--text);
}
.nav-btn:active { background: #eef1f7; }

.cal-titlebar { display: flex; align-items: baseline; gap: 12px; }
.cal-titlebar .mnum  { font-size: 46px; font-weight: 800; line-height: 1; }
.cal-titlebar .mname { font-size: 30px; font-weight: 700; }
.cal-titlebar .year  { margin-left: auto; font-size: 30px; font-weight: 800; }

/* ボタン共通 */
.ghost-btn, .primary-btn, .danger-btn {
  border-radius: 9px; padding: 7px 13px; font-size: 14px; cursor: pointer;
  border: 1px solid var(--line);
}
.ghost-btn { background: #fff; color: var(--text); }
.primary-btn { background: var(--accent); color: #fff; border-color: var(--accent); }
.danger-btn { background: #fff; color: var(--sun); border-color: #f0c3bb; }

/* ===== 曜日見出し（日＝赤 / 土＝青 / 平日＝グレー） ===== */
.weekdays {
  display: grid; grid-template-columns: repeat(7, 1fr);
  border-top: 1px solid var(--line); border-left: 1px solid var(--line);
}
.weekdays > div {
  text-align: center; padding: 9px 0; font-weight: 700; font-size: 14px;
  background: var(--wd-bg); color: #333;
  border-right: 1px solid var(--line); border-bottom: 1px solid var(--line);
  -webkit-print-color-adjust: exact; print-color-adjust: exact;
}
.weekdays .wd-sun { background: var(--sun); color: #fff; }
.weekdays .wd-sat { background: var(--sat); color: #fff; }

/* ===== カレンダー本体 ===== */
.calendar { border-left: 1px solid var(--line); background: #fff; }
.week-grid { display: grid; grid-template-columns: repeat(7, 1fr); }
.day {
  position: relative; min-height: 108px;
  border-right: 1px solid var(--line); border-bottom: 1px solid var(--line);
  cursor: pointer; overflow: hidden; background: #fff;
  -webkit-print-color-adjust: exact; print-color-adjust: exact;
}
.day.other-month { background: #ffffff; cursor: default; }

/* 日付番号（左上） */
.day-num {
  position: absolute; top: 4px; left: 7px; z-index: 2;
  font-size: 14px; font-weight: 700; color: var(--text);
}
.day.sun .day-num, .day.holiday .day-num { color: var(--sun); }
.day.sat .day-num { color: var(--sat); }
.day.other-month .day-num { color: #c3cad6; }

/* 右上ノート（祝日名 / ブログ担当。赤・小） */
.day-note {
  position: absolute; top: 5px; right: 7px; z-index: 2;
  font-size: 10px; color: var(--sun); text-align: right;
  line-height: 1.2; white-space: pre-line; max-width: 62%;
}

/* マス内の中身（練習＝場所＋時間 / イベント＝タイトル）。マスの中央に配置 */
.cell-body {
  position: absolute; inset: 0; z-index: 1;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  text-align: center; padding: 24px 5px 8px;
}
.cb-place { font-size: 15px; font-weight: 700; line-height: 1.2; word-break: break-word; }
.cb-title { font-size: 16px; font-weight: 700; line-height: 1.25; word-break: break-word; }
.cb-time  {
  margin-top: 6px; font-size: 11px; color: #555;
  line-height: 1.3; white-space: pre-line;   /* 2部練は改行で2行表示 */
}

/* 1日に複数の予定がある場合の縦並び（まれ） */
.day.multi { padding-top: 20px; display: flex; flex-direction: column; }
.day.multi .fill-block {
  position: relative; flex: 1; min-height: 40px; margin-top: 1px;
  -webkit-print-color-adjust: exact; print-color-adjust: exact;
}
.day.multi .cell-body { position: relative; inset: auto; padding: 4px; }

/* ===== モーダル ===== */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(15,23,42,.45);
  display: none; align-items: flex-start; justify-content: center;
  padding: 16px; z-index: 50; overflow-y: auto;
}
.modal-overlay.show { display: flex; }
.modal {
  background: var(--panel); width: 100%; max-width: 440px;
  border-radius: 14px; padding: 16px; margin-top: 24px;
  box-shadow: 0 12px 40px rgba(0,0,0,.25);
}
.modal-head { display: flex; align-items: center; justify-content: space-between; }
.modal-head h3 { margin: 0; font-size: 17px; }
.icon-btn {
  border: none; background: none; font-size: 24px; line-height: 1;
  cursor: pointer; color: var(--muted);
}

.existing-list { margin: 8px 0; display: flex; flex-direction: column; gap: 6px; }
.existing-item {
  display: flex; align-items: center; gap: 8px; padding: 7px 10px;
  border: 1px solid var(--line); border-radius: 9px; cursor: pointer; font-size: 13px;
}
.existing-item:hover { background: #f5f7fb; }
.existing-swatch { width: 12px; height: 12px; border-radius: 3px; flex: 0 0 auto; }

/* フォーム */
.form { margin-top: 6px; }
.field { margin-bottom: 12px; }
.field > label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
.field input[type="text"], .field input[type="date"], .field textarea {
  width: 100%; padding: 9px 10px; border: 1px solid var(--line);
  border-radius: 9px; font-size: 15px; background: #fff; color: var(--text);
  font-family: inherit;
}
.field textarea { resize: vertical; line-height: 1.3; }
.two-col { display: flex; gap: 10px; }
.two-col > div { flex: 1; }
.hint { font-size: 11px; color: var(--muted); margin: 5px 0 0; }
.day-target { font-size: 13px; font-weight: 700; margin: 2px 0 10px; }

/* セグメントボタン（種別 / 繰り返し切替） */
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; }
.seg-btn {
  border: none; background: #fff; padding: 8px 16px; font-size: 14px;
  cursor: pointer; color: var(--muted);
}
.seg-btn.active { background: var(--accent); color: #fff; }

/* 色プリセット */
.color-row { display: flex; align-items: center; gap: 10px; }
.presets { display: flex; gap: 7px; flex-wrap: wrap; }
.preset {
  width: 26px; height: 26px; border-radius: 50%; cursor: pointer;
  border: 2px solid transparent;
}
.preset.selected { border-color: #26303d; box-shadow: 0 0 0 2px #fff inset; }
#fColor { width: 40px; height: 32px; border: 1px solid var(--line); border-radius: 8px; padding: 0; background: #fff; }

.modal-footer { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
.modal-footer .spacer { flex: 1; }

/* ===== JPG出力プレビュー ===== */
.export-modal { max-width: 820px; }
.export-preview {
  margin: 8px 0; border: 1px solid var(--line); border-radius: 8px;
  overflow: hidden; background: #fff;
}
.export-preview img { width: 100%; display: block; }
a.primary-btn { text-decoration: none; display: inline-block; }

/* ローディング */
.loading {
  position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
  background: rgba(15,23,42,.85); color: #fff; padding: 8px 16px;
  border-radius: 20px; font-size: 13px; display: none; z-index: 60;
}
.loading.show { display: block; }

/* ===== スマホ対応 ===== */
@media (max-width: 560px) {
  #app { padding: 6px; }
  .cal-titlebar .mnum { font-size: 34px; }
  .cal-titlebar .mname, .cal-titlebar .year { font-size: 22px; }
  .weekdays > div { font-size: 12px; padding: 6px 0; }
  .day { min-height: 72px; }
  .day-num { font-size: 12px; top: 2px; left: 4px; }
  .day-note { font-size: 9px; top: 2px; right: 4px; }
  .cb-place { font-size: 12px; }
  .cb-title { font-size: 12px; }
  .cb-time { font-size: 9px; }
  /* 狭いマスでは中身を上寄せ＆マスを内容に合わせて伸ばし、日付番号と重ならない・切れないようにする */
  .cell-body { position: static; inset: auto; padding: 20px 3px 6px; justify-content: flex-start; }
  .two-col { flex-direction: column; }
}

/* ===== 印刷（PDF出力）用 =====
   PDFボタン → 印刷ダイアログ → 「PDFに保存」で1枚のカレンダーになります */
@media print {
  /* 印刷時は全要素で背景色・色をそのまま出す（色が枠線だけになる現象の対策） */
  * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
  body { background: #fff; }
  .cal-toolbar { display: none; }
  .modal-overlay, .loading { display: none !important; }
  #app { max-width: 100%; padding: 0; }
  .day { min-height: 96px; }
}
</style>
