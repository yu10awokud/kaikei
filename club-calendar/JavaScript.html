<script>
/* =========================================================
   部活カレンダー フロントロジック
   - サーバー(Code.gs)とは google.script.run で通信
   - カレンダー描画・モーダル操作・予定の展開をここで行う

   ざっくり構成:
     [1] 状態と定数
     [2] 日付ユーティリティ
     [3] データ読み込み
     [4] カレンダー描画（帯バー / 練習マス）
     [5] モーダル（追加・編集・削除）
     [6] イベント登録・初期化
   ========================================================= */

/* ---------- [1] 状態と定数 ---------- */
const PRESET_COLORS = ['#4f86ff', '#ff6b6b', '#f6a609', '#38b48b', '#9b6dff', '#8a8a8a'];

// ヘッダーに出す英語月名（「8 August」表記用）
const MONTH_NAMES = ['January', 'February', 'March', 'April', 'May', 'June',
                     'July', 'August', 'September', 'October', 'November', 'December'];

// 帯バーの寸法（Stylesheet の --bar-h / --bar-gap と合わせる）
const BAR_H = 20, BAR_GAP = 3, BAR_TOP = 20;

const state = {
  year: 0,
  month: 0,            // 1〜12
  schedules: [],       // サーバーから取得した全予定
  overrides: [],       // 「毎週予定のこの日だけ変更/非表示」の例外
  overrideMap: {},     // 'masterId|date' → 例外オブジェクト（高速参照用）
  holidays: {},        // { 'yyyy-MM-dd': '祝日名' }
  editing: null,       // 編集中の予定id（新規なら null）
  editMaster: null,    // 編集中の親予定オブジェクト
  editDate: null,      // 編集対象のオカレンス日（毎週予定の「この日だけ」用）
  editIsWeekly: false, // 編集中が毎週予定か
  editHasOverride: false // その日に既存の例外があるか
};

/* ---------- [2] 日付ユーティリティ ---------- */
function pad(n) { return String(n).padStart(2, '0'); }
function ymd(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function parseYmd(s) { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); }
function addDays(d, n) { const r = new Date(d); r.setDate(r.getDate() + n); return r; }
function daysBetween(a, b) { return Math.round((parseYmd(ymd(b)) - parseYmd(ymd(a))) / 86400000); }

/* ---------- [3] データ読み込み ---------- */
function showLoading(on) { document.getElementById('loading').classList.toggle('show', on); }

function load() {
  showLoading(true);
  // 予定・例外・祝日をまとめて1回で取得
  google.script.run
    .withSuccessHandler(function (data) {
      state.schedules = (data && data.schedules) || [];
      state.overrides = (data && data.overrides) || [];
      // 例外を 'masterId|date' で引ける形にしておく
      state.overrideMap = {};
      state.overrides.forEach(function (ov) {
        state.overrideMap[ov.masterId + '|' + ov.date] = ov;
      });
      state.holidays = (data && data.holidays) || {};
      showLoading(false);
      render();
    })
    .withFailureHandler(function (err) {
      showLoading(false);
      alert('読み込みに失敗しました: ' + err.message);
    })
    .getCalendarData(state.year, state.month);
}

/** その日の例外を取得（毎週予定のみ対象） */
function getOverride(masterId, dateStr) {
  return state.overrideMap[masterId + '|' + dateStr] || null;
}

/**
 * 毎週予定 s の、指定日の「実際に表示する値」を返す。
 * 例外があればその値で上書きし（この日だけ変更）、_hidden も持たせる。
 * 単発の予定はそのまま返す。
 */
function effective(s, dateStr) {
  if (s.recurrence !== 'weekly') return s;
  const ov = getOverride(s.id, dateStr);
  if (!ov) return s;
  const m = Object.assign({}, s);
  m.title = ov.title;
  m.place = ov.place;
  m.blogUser = ov.blogUser;
  m.time = ov.time;
  m.color = ov.color || s.color;
  m._hidden = ov.hidden;   // その日だけ非表示
  m._ovDate = dateStr;     // 対象日
  return m;
}

/* ---------- [4] カレンダー描画 ---------- */

/** 予定 s が dateStr（'yyyy-MM-dd'）に出現するか判定 */
function occursOn(s, dateStr) {
  const date = parseYmd(dateStr);
  if (s.recurrence === 'weekly') {
    if (date.getDay() !== Number(s.weekday) || date < parseYmd(s.startDate)) return false;
    const ov = getOverride(s.id, dateStr);
    if (ov && ov.hidden) return false; // 「この日だけ非表示」
    return true;
  }
  if (s.type === 'event') {
    return dateStr >= s.startDate && dateStr <= (s.endDate || s.startDate);
  }
  // practice / single
  return dateStr === s.startDate;
}

/** その日に出現する予定一覧（モーダルの既存リスト用） */
function schedulesOnDate(dateStr) {
  return state.schedules.filter(s => occursOn(s, dateStr));
}

/** 複数日にまたがるイベントか（＝カレンダー上で帯バー表示にする対象） */
function isMultiDay(s) {
  return s.type === 'event' && s.recurrence === 'none' &&
         s.endDate && s.endDate !== s.startDate;
}

function render() {
  // ヘッダー（例：8 / August / 2026）
  document.getElementById('monthNum').textContent = state.month;
  document.getElementById('monthName').textContent = MONTH_NAMES[state.month - 1];
  document.getElementById('yearLabel').textContent = state.year;

  const cal = document.getElementById('calendar');
  cal.innerHTML = '';

  // 月の最初の日曜（グリッド開始日）。常に6週ぶん描画し、前月末・翌月頭はグレー表示
  const first = new Date(state.year, state.month - 1, 1);
  const gridStart = addDays(first, -first.getDay());
  const gridStartStr = ymd(gridStart);
  const gridEndStr = ymd(addDays(gridStart, 41));
  const WEEKS = 6;

  // ---- 複数日イベント（合宿・大会など）→ 期間のマスを色で塗りつぶす ----
  // mdMap[dStr] = { color, title, sched }  ※タイトルは期間の中央日だけに表示
  const mdMap = {};
  state.schedules.forEach(s => {
    if (!isMultiDay(s)) return;
    let st = s.startDate < gridStartStr ? gridStartStr : s.startDate;
    let en = (s.endDate || s.startDate) > gridEndStr ? gridEndStr : (s.endDate || s.startDate);
    if (st > gridEndStr || en < gridStartStr || st > en) return;
    const days = [];
    for (let d = parseYmd(st); ymd(d) <= en; d = addDays(d, 1)) days.push(ymd(d));
    const midStr = days[Math.floor((days.length - 1) / 2)]; // 中央の日
    days.forEach(dStr => {
      mdMap[dStr] = { color: s.color, title: dStr === midStr ? (s.title || '') : '', sched: s };
    });
  });

  // 6週間ぶんを描画
  for (let w = 0; w < WEEKS; w++) {
    const weekStart = addDays(gridStart, w * 7);
    const weekEl = document.createElement('div');
    weekEl.className = 'week';
    const grid = document.createElement('div');
    grid.className = 'week-grid';

    for (let c = 0; c < 7; c++) {
      const d = addDays(weekStart, c);
      const dStr = ymd(d);
      const dow = d.getDay();
      const inMonth = (d.getMonth() + 1) === state.month;
      const holiday = state.holidays[dStr];

      const dayEl = document.createElement('div');
      dayEl.className = 'day';
      if (dow === 0) dayEl.classList.add('sun');
      if (dow === 6) dayEl.classList.add('sat');
      if (holiday) dayEl.classList.add('holiday');
      if (!inMonth) dayEl.classList.add('other-month');

      // 日付番号（マス左上）
      const num = document.createElement('div');
      num.className = 'day-num';
      num.textContent = d.getDate();
      dayEl.appendChild(num);

      // 前月末・翌月頭は番号のみ（グレー）で、予定・クリックなし
      if (!inMonth) { grid.appendChild(dayEl); continue; }
      dayEl.dataset.date = dStr;

      // このマスに載る要素を集める（複数日イベント塗り / 練習 / 単発・毎週イベント）
      const md = mdMap[dStr];
      const practices = schedulesOnDate(dStr).filter(s => s.type === 'practice').map(s => effective(s, dStr));
      const events = schedulesOnDate(dStr).filter(s => s.type === 'event' && !isMultiDay(s)).map(s => effective(s, dStr));

      const blocks = [];
      if (md) blocks.push({ kind: 'md', color: md.color, title: md.title, sched: md.sched });
      practices.forEach(p => blocks.push({ kind: 'practice', color: p.color, s: p }));
      events.forEach(e => blocks.push({ kind: 'event', color: e.color, s: e }));

      // 右上ノート（赤・小）：祝日名 ＋ 練習のブログ担当
      const noteText = buildNoteText(holiday, practices);
      if (noteText) {
        const note = document.createElement('div');
        note.className = 'day-note';
        note.textContent = noteText;
        dayEl.appendChild(note);
      }

      if (blocks.length === 1) {
        // マス全面を色で塗りつぶし（番号・ノートは上に重ねる）
        const b = blocks[0];
        dayEl.classList.add('filled');
        dayEl.style.background = hexToRgba(b.color, 0.16);
        dayEl.appendChild(buildCellBody(b));
        dayEl.addEventListener('click', function () { openModalForEdit(b.s || b.sched, dStr); });
      } else if (blocks.length > 1) {
        // 複数ある日は色つきブロックを縦に並べる
        dayEl.classList.add('multi');
        blocks.forEach(b => {
          const sub = document.createElement('div');
          sub.className = 'fill-block';
          sub.style.background = hexToRgba(b.color, 0.16);
          sub.appendChild(buildCellBody(b));
          sub.addEventListener('click', function (e) { e.stopPropagation(); openModalForEdit(b.s || b.sched, dStr); });
          dayEl.appendChild(sub);
        });
        dayEl.addEventListener('click', function (e) {
          if (e.target.closest('.fill-block')) return;
          openModalForAdd(dStr);
        });
      } else {
        // 予定なし → クリックで新規追加
        dayEl.addEventListener('click', function () { openModalForAdd(dStr); });
      }

      grid.appendChild(dayEl);
    }
    weekEl.appendChild(grid);
    cal.appendChild(weekEl);
  }
}

/** マス内の中身（練習＝場所＋時間 / イベント＝タイトル）を作る */
function buildCellBody(b) {
  const body = document.createElement('div');
  body.className = 'cell-body';

  if (b.kind === 'practice') {
    const s = b.s;
    const place = document.createElement('div');
    place.className = 'cb-place';
    place.textContent = s.place || '練習';
    place.style.color = darken(s.color);
    body.appendChild(place);
    if (s.time) {
      const time = document.createElement('div');
      time.className = 'cb-time';
      time.textContent = s.time; // 改行(\n)は CSS の pre-line で2行表示
      body.appendChild(time);
    }
  } else if (b.kind === 'md') {
    // 複数日イベント＝タイトルは期間の中央日だけ（他の日は色の塗りのみ）
    if (b.title) {
      const title = document.createElement('div');
      title.className = 'cb-title';
      title.textContent = b.title;
      title.style.color = darken(b.color);
      body.appendChild(title);
    }
  } else {
    // 単発・毎週イベント＝タイトルを中央に
    const title = document.createElement('div');
    title.className = 'cb-title';
    title.textContent = (b.s.title || '(無題)');
    title.style.color = darken(b.color);
    body.appendChild(title);
  }
  return body;
}

/** 右上ノート文字列（祝日名／ブログ担当）を組み立てる */
function buildNoteText(holiday, practices) {
  const parts = [];
  if (holiday) parts.push(holiday);
  practices.forEach(p => { if (p.blogUser) parts.push(p.blogUser); });
  return parts.join('\n');
}

/** '#rrggbb' → 'rgba(r,g,b,a)'（マス背景の薄い塗り用） */
function hexToRgba(hex, a) {
  const m = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex || '');
  if (!m) return 'rgba(79,134,255,' + a + ')';
  return 'rgba(' + parseInt(m[1], 16) + ',' + parseInt(m[2], 16) + ',' + parseInt(m[3], 16) + ',' + a + ')';
}

/** 予定色を暗くした文字色を返す（薄い塗りの上でも読めるように） */
function darken(hex) {
  const m = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex || '');
  if (!m) return '#333';
  const f = 0.55;
  return 'rgb(' + Math.round(parseInt(m[1], 16) * f) + ',' +
                  Math.round(parseInt(m[2], 16) * f) + ',' +
                  Math.round(parseInt(m[3], 16) * f) + ')';
}

/* ---------- [5] モーダル（追加・編集・削除） ---------- */
const modal = {
  overlay: null, title: null, type: 'practice', rec: 'none', color: PRESET_COLORS[0],
  scope: 'day' // 毎週予定を編集するときの範囲（day=この日だけ / all=毎週すべて）
};

/** 新規追加でモーダルを開く */
function openModalForAdd(dateStr) {
  state.editing = null;
  state.editMaster = null;
  state.editDate = dateStr;
  state.editIsWeekly = false;
  state.editHasOverride = false;
  document.getElementById('modalTitle').textContent = '予定を追加';
  document.getElementById('deleteBtn').style.display = 'none';
  document.getElementById('revertBtn').style.display = 'none';

  setType('practice');
  setRec('none');
  setColor(PRESET_COLORS[0]);
  document.getElementById('fTitle').value = '';
  document.getElementById('fPlace').value = '';
  document.getElementById('fBlog').value = '';
  document.getElementById('fTime').value = '';
  document.getElementById('fStart').value = dateStr;
  document.getElementById('fEnd').value = dateStr;

  updateScopeUI();
  renderExistingList(dateStr);
  showModal(true);
}

/**
 * 既存予定の編集でモーダルを開く。
 * @param {Object} s        表示中の値（毎週予定は例外反映済みの effective を渡す）
 * @param {string} dateStr  クリックしたオカレンスの日付（毎週予定の「この日だけ」用）
 */
function openModalForEdit(s, dateStr) {
  // 元データ（親）を保持。scope 切替時に親／この日の値を正しく出し分けるため
  const master = state.schedules.filter(function (x) { return x.id === s.id; })[0] || s;
  state.editing = s.id;
  state.editMaster = master;
  state.editDate = dateStr || s.startDate;
  state.editIsWeekly = (master.recurrence === 'weekly');
  state.editHasOverride = state.editIsWeekly && !!getOverride(s.id, state.editDate);

  document.getElementById('modalTitle').textContent = '予定を編集';
  document.getElementById('deleteBtn').style.display = 'inline-block';
  // 既に「この日だけ」変更がある場合のみ、初期設定に戻すボタンを出す
  document.getElementById('revertBtn').style.display = state.editHasOverride ? 'inline-block' : 'none';

  // 毎週予定は既定で「この日だけ」（＝ブログ担当だけ変える運用に合わせる）
  // setScope 側でフォームの値（親 / この日）も埋める
  setScope(state.editIsWeekly ? 'day' : 'all');

  document.getElementById('existingList').innerHTML = '';
  showModal(true);
}

/** フォーム各項目に予定オブジェクトの値を流し込む */
function fillForm(s) {
  setType(s.type);
  setRec(s.recurrence);
  setColor(s.color);
  document.getElementById('fTitle').value = s.title || '';
  document.getElementById('fPlace').value = s.place || '';
  document.getElementById('fBlog').value = s.blogUser || '';
  document.getElementById('fTime').value = s.time || '';
  document.getElementById('fStart').value = s.startDate;
  document.getElementById('fEnd').value = s.endDate || s.startDate;
}

/** その日の既存予定を一覧表示（クリックで編集に切替） */
function renderExistingList(dateStr) {
  const box = document.getElementById('existingList');
  box.innerHTML = '';
  const items = schedulesOnDate(dateStr);
  items.forEach(s => {
    const eff = effective(s, dateStr); // その日の実際の値
    const row = document.createElement('div');
    row.className = 'existing-item';
    const sw = document.createElement('span');
    sw.className = 'existing-swatch';
    sw.style.background = eff.color;
    row.appendChild(sw);
    const label = document.createElement('span');
    const kind = eff.type === 'event' ? 'イベント' : '練習';
    const name = eff.type === 'event' ? (eff.title || '(無題)') : (eff.place || '練習');
    label.textContent = kind + '：' + name + (s.recurrence === 'weekly' ? '（毎週）' : '');
    row.appendChild(label);
    row.addEventListener('click', function () { openModalForEdit(eff, dateStr); });
    box.appendChild(row);
  });
}

function showModal(on) {
  document.getElementById('modalOverlay').classList.toggle('show', on);
}

/** 種別（練習/イベント）を切替え、フォームの表示を調整 */
function setType(type) {
  modal.type = type;
  document.querySelectorAll('#typeSeg .seg-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.type === type);
  });
  document.getElementById('eventFields').style.display = type === 'event' ? 'block' : 'none';
  document.getElementById('practiceFields').style.display = type === 'practice' ? 'block' : 'none';
  updateDateFields();
}

/** 繰り返し（単発/毎週）を切替え */
function setRec(rec) {
  modal.rec = rec;
  document.querySelectorAll('#recSeg .seg-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.rec === rec);
  });
  updateDateFields();
}

/** 種別・繰り返しに応じて終了日欄やラベルを出し分け */
function updateDateFields() {
  const weekly = modal.rec === 'weekly';
  // 終了日は「単発イベント」のときだけ意味を持つ
  const showEnd = (modal.type === 'event' && !weekly);
  document.getElementById('endWrap').style.display = showEnd ? 'block' : 'none';
  document.getElementById('weeklyHint').style.display = weekly ? 'block' : 'none';
  document.getElementById('startLabel').textContent = weekly ? '開始日（この曜日で毎週）' : '日付';
}

/** 変更範囲（この日だけ / 毎週すべて）を切替。範囲に応じて表示値も入れ替える */
function setScope(scope) {
  modal.scope = scope;
  document.querySelectorAll('#scopeSeg .seg-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.scope === scope);
  });
  // 編集中は、この日だけ＝例外反映値 / 毎週すべて＝親の値 を出す
  if (state.editMaster) {
    fillForm(scope === 'day' ? effective(state.editMaster, state.editDate) : state.editMaster);
  }
  updateScopeUI();
}

/**
 * 範囲に応じてフォームの見せ方を調整。
 * - 毎週予定の編集時のみ「範囲」セレクタを表示
 * - 「この日だけ」のときは種別・繰り返し・日付欄を隠し、対象日を明示
 *   （例外は「その日の場所/担当/時間/色」だけを持つため）
 */
function updateScopeUI() {
  const weeklyEdit = !!state.editing && state.editIsWeekly;
  document.getElementById('scopeField').style.display = weeklyEdit ? 'block' : 'none';

  const dayMode = weeklyEdit && modal.scope === 'day';
  document.getElementById('typeSeg').closest('.field').style.display = dayMode ? 'none' : 'block';
  document.getElementById('recSeg').closest('.field').style.display = dayMode ? 'none' : 'block';
  document.getElementById('dateFields').style.display = dayMode ? 'none' : 'flex';

  const note = document.getElementById('dayTargetNote');
  if (dayMode) {
    note.style.display = 'block';
    note.textContent = '対象日: ' + state.editDate + '（この日だけ変更／他の週はそのまま）';
  } else {
    note.style.display = 'none';
    updateDateFields();
  }
}

/** 色を選択（プリセット＆カラーピッカーを同期） */
function setColor(color) {
  modal.color = color;
  document.getElementById('fColor').value = color;
  document.querySelectorAll('#presetColors .preset').forEach(p => {
    p.classList.toggle('selected', p.dataset.color.toLowerCase() === color.toLowerCase());
  });
}

/** 保存 */
function saveModal() {
  // ---- 毎週予定の「この日だけ」変更 → 例外を保存（親はそのまま） ----
  if (state.editing && state.editIsWeekly && modal.scope === 'day') {
    const ov = {
      masterId: state.editing,
      date: state.editDate,
      title: document.getElementById('fTitle').value,
      place: document.getElementById('fPlace').value,
      blogUser: document.getElementById('fBlog').value,
      time: document.getElementById('fTime').value,
      color: modal.color,
      hidden: false
    };
    showLoading(true);
    google.script.run
      .withSuccessHandler(function () { showModal(false); load(); })
      .withFailureHandler(function (err) { showLoading(false); alert('保存に失敗しました: ' + err.message); })
      .saveOverride(ov);
    return;
  }

  // ---- 通常保存（新規 / 単発の編集 / 毎週すべての編集） ----
  const start = document.getElementById('fStart').value;
  if (!start) { alert('日付を入力してください'); return; }

  let end = start;
  if (modal.type === 'event' && modal.rec === 'none') {
    end = document.getElementById('fEnd').value || start;
    if (end < start) { alert('終了日は開始日以降にしてください'); return; }
  }

  const rec = {
    id: state.editing || '',
    type: modal.type,
    title: document.getElementById('fTitle').value,
    place: document.getElementById('fPlace').value,
    blogUser: document.getElementById('fBlog').value,
    time: document.getElementById('fTime').value,
    color: modal.color,
    recurrence: modal.rec,
    startDate: start,
    endDate: end
  };

  showLoading(true);
  google.script.run
    .withSuccessHandler(function () { showModal(false); load(); })
    .withFailureHandler(function (err) { showLoading(false); alert('保存に失敗しました: ' + err.message); })
    .saveSchedule(rec);
}

/** 削除 */
function deleteCurrent() {
  if (!state.editing) return;

  // 毎週予定の「この日だけ」→ その日を非表示にする例外を保存
  if (state.editIsWeekly && modal.scope === 'day') {
    if (!confirm('この日だけ非表示にしますか？（他の週の予定は残ります）')) return;
    showLoading(true);
    google.script.run
      .withSuccessHandler(function () { showModal(false); load(); })
      .withFailureHandler(function (err) { showLoading(false); alert('更新に失敗しました: ' + err.message); })
      .saveOverride({
        masterId: state.editing, date: state.editDate,
        title: '', place: '', blogUser: '', time: '', color: '', hidden: true
      });
    return;
  }

  const msg = state.editIsWeekly ? 'この毎週予定を全て削除しますか？' : 'この予定を削除しますか？';
  if (!confirm(msg)) return;
  showLoading(true);
  google.script.run
    .withSuccessHandler(function () { showModal(false); load(); })
    .withFailureHandler(function (err) { showLoading(false); alert('削除に失敗しました: ' + err.message); })
    .deleteSchedule(state.editing);
}

/** 「この日だけ」変更を取り消して、毎週の初期設定に戻す */
function revertOverride() {
  if (!state.editing || !state.editDate) return;
  if (!confirm('この日を毎週の初期設定に戻しますか？')) return;
  showLoading(true);
  google.script.run
    .withSuccessHandler(function () { showModal(false); load(); })
    .withFailureHandler(function (err) { showLoading(false); alert('取り消しに失敗しました: ' + err.message); })
    .deleteOverride(state.editing, state.editDate);
}

/* ---------- [6] イベント登録・初期化 ---------- */
function changeMonth(delta) {
  let m = state.month + delta;
  let y = state.year;
  if (m < 1) { m = 12; y--; }
  if (m > 12) { m = 1; y++; }
  state.year = y; state.month = m;
  load();
}

function initColorPresets() {
  const box = document.getElementById('presetColors');
  PRESET_COLORS.forEach(c => {
    const p = document.createElement('div');
    p.className = 'preset';
    p.style.background = c;
    p.dataset.color = c;
    p.addEventListener('click', function () { setColor(c); });
    box.appendChild(p);
  });
}

function bindEvents() {
  document.getElementById('prevMonth').addEventListener('click', () => changeMonth(-1));
  document.getElementById('nextMonth').addEventListener('click', () => changeMonth(1));
  document.getElementById('todayBtn').addEventListener('click', function () {
    const now = new Date();
    state.year = now.getFullYear(); state.month = now.getMonth() + 1;
    load();
  });
  document.getElementById('pdfBtn').addEventListener('click', function () { window.print(); });

  // モーダル操作
  document.getElementById('modalCloseBtn').addEventListener('click', () => showModal(false));
  document.getElementById('cancelBtn').addEventListener('click', () => showModal(false));
  document.getElementById('saveBtn').addEventListener('click', saveModal);
  document.getElementById('deleteBtn').addEventListener('click', deleteCurrent);
  document.getElementById('revertBtn').addEventListener('click', revertOverride);
  document.getElementById('modalOverlay').addEventListener('click', function (e) {
    if (e.target === this) showModal(false); // 背景クリックで閉じる
  });

  // 種別・繰り返し・変更範囲の切替
  document.querySelectorAll('#typeSeg .seg-btn').forEach(b => {
    b.addEventListener('click', () => setType(b.dataset.type));
  });
  document.querySelectorAll('#recSeg .seg-btn').forEach(b => {
    b.addEventListener('click', () => setRec(b.dataset.rec));
  });
  document.querySelectorAll('#scopeSeg .seg-btn').forEach(b => {
    b.addEventListener('click', () => setScope(b.dataset.scope));
  });
  // カラーピッカー手動変更
  document.getElementById('fColor').addEventListener('input', function () { setColor(this.value); });
}

// 起動
(function start() {
  const now = new Date();
  state.year = now.getFullYear();
  state.month = now.getMonth() + 1;
  initColorPresets();
  bindEvents();
  load();
})();
</script>
