<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <?!= include('Stylesheet'); ?>
</head>
<body>
  <div id="app">
    <!-- ===== ヘッダー / ナビ ===== -->
    <header class="app-header">
      <button id="menuBtn" class="menu-btn" aria-label="メニュー">☰</button>
      <h1 id="screenTitle">記録入力</h1>
      <span class="header-logo">🏊</span>
    </header>

    <nav id="drawer" class="drawer">
      <button class="nav-item active" data-screen="input">📝 記録入力</button>
      <button class="nav-item" data-screen="history">📅 履歴一覧</button>
      <button class="nav-item" data-screen="analysis">📈 分析</button>
      <button class="nav-item" data-screen="meets">🏅 試合記録</button>
      <button class="nav-item" data-screen="events">🏷 種目マスタ</button>
      <button class="nav-item" data-screen="pools">🏊 プールマスタ</button>
    </nav>
    <div id="drawerOverlay" class="drawer-overlay"></div>

    <main class="content">

      <!-- ===== ①記録入力 ===== -->
      <section id="input" class="screen active">
        <div class="form-block">
          <label class="field-label">日付</label>
          <input type="date" id="inDate" class="input">

          <label class="field-label">総距離 (m)</label>
          <input type="number" id="inDistance" class="input" inputmode="numeric" placeholder="例: 3000">

          <label class="field-label">練習メモ</label>
          <textarea id="inMemo" class="input" rows="3" placeholder="体感・練習内容など"></textarea>
        </div>

        <h3 class="section-title">タイム記録を追加</h3>
        <div class="form-block time-add">
          <label class="field-label">形式</label>
          <div class="format-tabs" id="formatTabs">
            <button type="button" class="format-tab active" data-format="TT">TT</button>
            <button type="button" class="format-tab" data-format="Short">Short</button>
            <button type="button" class="format-tab" data-format="Middle">Middle</button>
          </div>
          <div class="format-hint" id="formatHint">TT（タイムトライアル）のみ分析グラフに反映されます</div>

          <div class="row2">
            <div>
              <label class="field-label">種目</label>
              <select id="inEvent" class="input"></select>
            </div>
            <div>
              <label class="field-label">プール</label>
              <select id="inPool" class="input"></select>
            </div>
          </div>

          <!-- TT: 1本ずつ入力 -->
          <div id="ttFields">
            <div class="row2">
              <div>
                <label class="field-label">距離 (m)</label>
                <input type="number" id="inTimeDistance" class="input" inputmode="numeric" placeholder="50">
              </div>
              <div>
                <label class="field-label">タイム</label>
                <input type="text" id="inTime" class="input" inputmode="decimal" placeholder="1:19.50 / 30.20">
              </div>
            </div>
            <button id="addTimeBtn" class="btn secondary block">＋ この記録を追加</button>
          </div>

          <!-- Short / Middle: 距離 × 本数 × セット をまとめて入力 -->
          <div id="setFields" class="hidden">
            <div class="row3">
              <div>
                <label class="field-label">距離 (m)</label>
                <input type="number" id="setDistance" class="input" inputmode="numeric" placeholder="50">
              </div>
              <div>
                <label class="field-label">本数</label>
                <input type="number" id="setReps" class="input" inputmode="numeric" placeholder="4">
              </div>
              <div>
                <label class="field-label">セット</label>
                <input type="number" id="setSets" class="input" inputmode="numeric" placeholder="2">
              </div>
            </div>
            <div class="set-summary" id="setSummary"></div>
            <button id="buildGridBtn" class="btn secondary block">入力欄を作成</button>
            <div id="timeGrid" class="time-grid"></div>
            <button id="addGridBtn" class="btn secondary block hidden">＋ まとめてリストに追加</button>
          </div>
        </div>

        <ul id="pendingList" class="pending-list"></ul>

        <button id="savePracticeBtn" class="btn primary block big">保存する</button>
      </section>

      <!-- ===== ②履歴一覧 ===== -->
      <section id="history" class="screen">
        <div class="filter-bar row2">
          <div>
            <label class="field-label">種目で絞り込み</label>
            <select id="historyFilter" class="input"></select>
          </div>
          <div>
            <label class="field-label">日付で絞り込み</label>
            <input type="date" id="historyDate" class="input">
          </div>
        </div>
        <button id="historyClearDate" class="btn secondary block hidden" style="margin-bottom:12px;">日付の絞り込みを解除</button>
        <div id="historyList" class="history-list"></div>
      </section>

      <!-- ===== ③分析 ===== -->
      <section id="analysis" class="screen">
        <div class="format-tabs" id="analysisModeTabs">
          <button type="button" class="format-tab active" data-mode="time">タイム推移</button>
          <button type="button" class="format-tab" data-mode="distance">総距離推移</button>
        </div>

        <div id="anTimeFilters" class="row2">
          <div>
            <label class="field-label">種目</label>
            <select id="anEvent" class="input"></select>
          </div>
          <div>
            <label class="field-label">水路タイプ</label>
            <select id="anLane" class="input">
              <option value="両方">両方</option>
              <option value="長水路">長水路</option>
              <option value="短水路">短水路</option>
            </select>
          </div>
        </div>

        <div class="period-tabs" id="periodTabs">
          <button class="period-tab" data-period="week">週間</button>
          <button class="period-tab" data-period="month">月間</button>
          <button class="period-tab" data-period="3month">3か月</button>
          <button class="period-tab active" data-period="all">全期間</button>
        </div>

        <div class="chart-hint" id="chartHint">↑ 上にいくほど速い（タイムが小さい）</div>
        <div class="chart-legend hidden" id="chartLegend">
          <span class="lg-item"><span class="lg-dot blue"></span>練習(TT)</span>
          <span class="lg-item"><span class="lg-dot red"></span>試合</span>
        </div>
        <div class="chart-wrap">
          <canvas id="analysisChart"></canvas>
        </div>
        <div id="analysisEmpty" class="empty-msg hidden">該当する記録がありません</div>
      </section>

      <!-- ===== 試合記録 ===== -->
      <section id="meets" class="screen">
        <div class="form-block">
          <label class="field-label">大会名</label>
          <input type="text" id="meetName" class="input" placeholder="例: 県選手権">
          <div class="row2">
            <div>
              <label class="field-label">日付</label>
              <input type="date" id="meetDate" class="input">
            </div>
            <div>
              <label class="field-label">水路タイプ</label>
              <select id="meetLane" class="input">
                <option value="長水路">長水路</option>
                <option value="短水路">短水路</option>
              </select>
            </div>
          </div>
          <div class="row2">
            <div>
              <label class="field-label">種目</label>
              <select id="meetEvent" class="input"></select>
            </div>
            <div>
              <label class="field-label">距離 (m)</label>
              <input type="number" id="meetDistance" class="input" inputmode="numeric" placeholder="100">
            </div>
          </div>
          <div class="row2">
            <div>
              <label class="field-label">種別</label>
              <select id="meetKind" class="input">
                <option value="正式">正式</option>
                <option value="引継ぎ">引継ぎ</option>
              </select>
            </div>
            <div>
              <label class="field-label">タイム</label>
              <input type="text" id="meetTime" class="input" inputmode="decimal" placeholder="1:19.50 / 30.20">
            </div>
          </div>
          <button id="saveMeetBtn" class="btn primary block big">試合記録を保存</button>
        </div>
        <h3 class="section-title">試合記録一覧</h3>
        <div id="meetList" class="history-list"></div>
      </section>

      <!-- ===== ④種目マスタ ===== -->
      <section id="events" class="screen">
        <div class="form-block">
          <label class="field-label">種目名</label>
          <div class="row-inline">
            <input type="text" id="newEventName" class="input" placeholder="例: 200Ba">
            <button id="addEventBtn" class="btn primary">追加</button>
          </div>
        </div>
        <ul id="eventList" class="master-list"></ul>
      </section>

      <!-- ===== ⑤プールマスタ ===== -->
      <section id="pools" class="screen">
        <div class="form-block">
          <label class="field-label">プール名</label>
          <input type="text" id="newPoolName" class="input" placeholder="例: 大学プール">
          <label class="field-label">水路タイプ</label>
          <div class="row-inline">
            <select id="newPoolLane" class="input">
              <option value="長水路">長水路</option>
              <option value="短水路">短水路</option>
            </select>
            <button id="addPoolBtn" class="btn primary">追加</button>
          </div>
        </div>
        <ul id="poolList" class="master-list"></ul>
      </section>

    </main>
  </div>

  <!-- ===== 編集モーダル（履歴の編集） ===== -->
  <div id="editOverlay" class="modal-overlay">
    <div class="modal">
      <h3>練習記録を編集</h3>
      <label class="field-label">日付</label>
      <input type="date" id="editDate" class="input">
      <label class="field-label">総距離 (m)</label>
      <input type="number" id="editDistance" class="input" inputmode="numeric">
      <label class="field-label">メモ</label>
      <textarea id="editMemo" class="input" rows="2"></textarea>

      <h4 class="section-title">タイム記録</h4>
      <ul id="editTimeList" class="pending-list"></ul>

      <div class="edit-add">
        <div class="row2">
          <select id="editEvent" class="input"></select>
          <input type="number" id="editTimeDistance" class="input" placeholder="距離m">
        </div>
        <div class="row2">
          <input type="text" id="editTime" class="input" placeholder="1:19.50">
          <select id="editPool" class="input"></select>
        </div>
        <select id="editFormat" class="input">
          <option value="TT">TT（分析に反映）</option>
          <option value="Short">Short</option>
          <option value="Middle">Middle</option>
        </select>
        <button id="editAddTimeBtn" class="btn secondary block">＋ タイムを追加</button>
      </div>

      <div class="modal-footer">
        <button id="editCancelBtn" class="btn">キャンセル</button>
        <button id="editSaveBtn" class="btn primary">保存</button>
      </div>
    </div>
  </div>

  <div id="loading" class="loading"><div class="spinner"></div></div>
  <div id="toast" class="toast"></div>

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <?!= include('JavaScript'); ?>
</body>
</html>
