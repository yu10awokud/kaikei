<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <?!= include('Stylesheet'); ?>
</head>
<body>
  <div id="app">
    <header class="app-header">
      <h1>収入管理ツール</h1>
      <div class="month-nav">
        <button id="prevMonth" class="nav-btn">‹</button>
        <span id="currentMonthLabel">----年--月</span>
        <button id="nextMonth" class="nav-btn">›</button>
      </div>
    </header>

    <!-- タブ -->
    <nav class="tabs">
      <button class="tab active" data-tab="dashboard">トップ</button>
      <button class="tab" data-tab="calendar">カレンダー（家庭教師）</button>
      <button class="tab" data-tab="swing">スイング投資</button>
      <button class="tab" data-tab="settings">設定</button>
    </nav>

    <!-- ===== トップ（ダッシュボード） ===== -->
    <section id="dashboard" class="panel active">
      <div class="cards">
        <div class="card big">
          <div class="card-label">今月の収入</div>
          <div class="card-value" id="dashCurrentTotal">¥0</div>
          <div class="card-diff" id="dashDiffTotal">前月比 ±0</div>
        </div>
        <div class="card">
          <div class="card-label">先月の収入</div>
          <div class="card-value" id="dashPrevTotal">¥0</div>
        </div>
      </div>

      <h3 class="section-title">内訳（今月）</h3>
      <div class="breakdown">
        <div class="bd-row">
          <span>家庭教師</span>
          <span id="dashTutor">¥0</span>
          <span class="bd-diff" id="dashDiffTutor">±0</span>
        </div>
        <div class="bd-row">
          <span>スイング投資</span>
          <span id="dashSwing">¥0</span>
          <span class="bd-diff" id="dashDiffSwing">±0</span>
        </div>
        <div class="bd-row sub">
          <span id="dashHoursA">生徒A: 0h</span>
          <span id="dashHoursB">生徒B: 0h</span>
          <span></span>
        </div>
      </div>
    </section>

    <!-- ===== カレンダー（家庭教師） ===== -->
    <section id="calendar" class="panel">
      <div class="legend">
        <span class="dot a"></span><span id="legendA">生徒A</span>
        <span class="dot b"></span><span id="legendB">生徒B</span>
      </div>
      <div class="weekdays">
        <span>日</span><span>月</span><span>火</span><span>水</span>
        <span>木</span><span>金</span><span>土</span>
      </div>
      <div id="calendarGrid" class="calendar-grid"></div>
      <div class="month-sum" id="tutorMonthSum">今月の家庭教師収入: ¥0</div>
    </section>

    <!-- ===== スイング投資 ===== -->
    <section id="swing" class="panel">
      <div class="swing-add">
        <input type="date" id="swingDate">
        <input type="number" id="swingProfit" placeholder="損益（円・マイナス可）">
        <input type="text" id="swingMemo" placeholder="メモ（任意）">
        <button id="swingAddBtn" class="primary">追加</button>
      </div>
      <div class="month-sum" id="swingMonthSum">今月の損益: ¥0</div>
      <table class="data-table">
        <thead>
          <tr><th>日付</th><th>損益</th><th>メモ</th><th></th></tr>
        </thead>
        <tbody id="swingTableBody"></tbody>
      </table>
    </section>

    <!-- ===== 設定 ===== -->
    <section id="settings" class="panel">
      <h3 class="section-title">マスタ設定</h3>
      <div class="form-grid">
        <label>生徒A 名前</label>
        <input type="text" id="setNameA">
        <label>生徒A 時給(円)</label>
        <input type="number" id="setRateA">
        <label>生徒B 名前</label>
        <input type="text" id="setNameB">
        <label>生徒B 時給(円)</label>
        <input type="number" id="setRateB">
      </div>
      <button id="saveSettingsBtn" class="primary">設定を保存</button>
    </section>
  </div>

  <!-- 勤務記録入力モーダル -->
  <div id="modalOverlay" class="modal-overlay">
    <div class="modal">
      <h3 id="modalDate">日付</h3>
      <div id="modalRecords"></div>
      <div class="modal-add">
        <select id="modalStudent">
          <option value="A">生徒A</option>
          <option value="B">生徒B</option>
        </select>
        <input type="number" id="modalHours" step="0.5" placeholder="時間">
        <input type="text" id="modalMemo" placeholder="メモ">
        <button id="modalAddBtn" class="primary">追加</button>
      </div>
      <div class="modal-footer">
        <button id="modalCloseBtn">閉じる</button>
      </div>
    </div>
  </div>

  <div id="loading" class="loading">処理中...</div>

  <?!= include('JavaScript'); ?>
</body>
</html>
