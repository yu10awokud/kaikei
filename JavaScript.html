<script>
// =====================================================
// 水泳練習記録アプリ クライアントJS
// =====================================================

// ---- 状態 ----
var state = {
  events: [],          // 有効な種目マスタ
  pools: [],           // 有効なプールマスタ
  pending: [],         // 入力画面で追加待ちのタイム記録
  inputFormat: 'TT',   // 記録入力画面で選択中の形式（TT / Short / Middle）
  editTimes: [],       // 編集モーダル内のタイム記録
  editLogId: null,
  analysisPeriod: 'all',
  analysisMode: 'time',   // 'time'（タイム推移） | 'distance'（総距離推移）
  bestLane: '両方',       // ベスト表の水路タイプ絞り込み
  chart: null,
  ttEntry: null,          // TT用タイム入力コンポーネント
  ttLapN: null,           // TT入力欄の現在のラップ本数（作り直し判定用）
  editEntry: null,        // 編集モーダル用タイム入力コンポーネント
  editLapN: null,         // 編集入力欄の現在のラップ本数
  gridEntries: [],        // Short/Middleの一括入力欄
  calYear: null, calMonth: null,   // カレンダー表示中の年月
  calSelectedDate: null,  // 選択中の日付
  calData: null,          // 当月のカレンダーデータ
  races: []               // 大会カウントダウン
};

// ベスト表の構成（種別ごとに 種目・距離 の対応を定義）
// 400/800は正式・Frのみ。引継ぎはBa・IMが存在せず、距離はFr=50/100/200、Br/Fly=50/100。
var BEST_SCHEMA = {
  '正式': {
    columns: [50, 100, 200, 400, 800],
    rows: [
      { event: 'Fr',  dists: [50, 100, 200, 400, 800] },
      { event: 'Ba',  dists: [50, 100, 200] },
      { event: 'Br',  dists: [50, 100, 200] },
      { event: 'Fly', dists: [50, 100, 200] },
      { event: 'IM',  dists: [50, 100, 200] }
    ]
  },
  '引継ぎ': {
    columns: [50, 100, 200],
    rows: [
      { event: 'Fr',  dists: [50, 100, 200] },
      { event: 'Br',  dists: [50, 100] },
      { event: 'Fly', dists: [50, 100] }
    ]
  }
};

// ---- ショートカット ----
function $(id) { return document.getElementById(id); }
function el(tag, cls, text) {
  var e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}
function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
function todayStr() {
  var d = new Date();
  var m = String(d.getMonth() + 1).padStart(2, '0');
  var day = String(d.getDate()).padStart(2, '0');
  return d.getFullYear() + '-' + m + '-' + day;
}

// ---- ローディング / トースト ----
function showLoading(b) { $('loading').classList.toggle('show', b); }
function toast(msg, isError) {
  var t = $('toast');
  t.textContent = msg;
  t.className = 'toast show' + (isError ? ' error' : '');
  setTimeout(function () { t.className = 'toast'; }, 2600);
}

// ---- サーバー呼び出しをPromise化 ----
function call(fn, args) {
  return new Promise(function (resolve, reject) {
    google.script.run
      .withSuccessHandler(resolve)
      .withFailureHandler(reject)[fn].apply(google.script.run, args || []);
  });
}

// =====================================================
// タイム変換（クライアント側：追加時の即時検証・表示用）
// =====================================================
function parseTimeToSeconds(input) {
  var s = String(input == null ? '' : input).trim();
  if (s === '') throw new Error('タイムを入力してください');
  var fmtErr = 'タイムの形式が不正です（例: 1.23.45 または 30.20）';

  // コロン形式（PC入力互換）
  var c = s.match(/^(\d+):([0-5]?\d)(\.\d+)?$/);
  if (c) {
    var t = parseInt(c[1], 10) * 60 + parseInt(c[2], 10) + (c[3] ? parseFloat(c[3]) : 0);
    return Math.round(t * 100) / 100;
  }

  // ドット形式
  var parts = s.split('.');
  if (parts.length === 1) {
    if (!/^\d+$/.test(parts[0])) throw new Error(fmtErr);
    return Number(parts[0]);
  }
  if (parts.length === 2) {
    if (!/^\d+$/.test(parts[0]) || !/^\d+$/.test(parts[1])) throw new Error(fmtErr);
    return Math.round(Number(parts[0] + '.' + parts[1]) * 100) / 100;
  }
  if (parts.length === 3) {
    if (!/^\d+$/.test(parts[0]) || !/^[0-5]?\d$/.test(parts[1]) || !/^\d{1,2}$/.test(parts[2])) {
      throw new Error(fmtErr);
    }
    var total = parseInt(parts[0], 10) * 60 + parseInt(parts[1], 10) + parseFloat('0.' + parts[2]);
    return Math.round(total * 100) / 100;
  }
  throw new Error(fmtErr);
}
function formatSeconds(sec) {
  var v = Number(sec) || 0;
  if (v >= 60) {
    var mm = Math.floor(v / 60);
    var ss = (v - mm * 60).toFixed(2);
    if (ss.length < 5) ss = '0' + ss;
    return mm + '.' + ss;
  }
  return v.toFixed(2);
}

// =====================================================
// ナビゲーション（ドロワー + SPA切替）
// =====================================================
var TITLES = { input: '記録入力', history: '履歴一覧', analysis: '分析', meets: '試合記録', best: 'ベスト', events: '種目マスタ', pools: 'プールマスタ' };

function openDrawer(b) {
  $('drawer').classList.toggle('open', b);
  $('drawerOverlay').classList.toggle('show', b);
}
function switchScreen(name) {
  document.querySelectorAll('.screen').forEach(function (s) { s.classList.remove('active'); });
  $(name).classList.add('active');
  document.querySelectorAll('.nav-item').forEach(function (n) {
    n.classList.toggle('active', n.dataset.screen === name);
  });
  $('screenTitle').textContent = TITLES[name] || '';
  openDrawer(false);
  onScreenEnter(name);
}
function onScreenEnter(name) {
  if (name === 'history') loadCalendar();
  else if (name === 'analysis') enterAnalysis();
  else if (name === 'meets') loadMeets();
  else if (name === 'best') loadBest();
  else if (name === 'events') renderEventMaster();
  else if (name === 'pools') renderPoolMaster();
}

// =====================================================
// マスタのプルダウン反映
// =====================================================
function fillEventSelect(sel, includeAllOption) {
  sel.innerHTML = '';
  if (includeAllOption) {
    var o = el('option', null, 'すべて');
    o.value = '';
    sel.appendChild(o);
  }
  state.events.forEach(function (ev) {
    var o = el('option', null, ev.name);
    o.value = ev.name;
    sel.appendChild(o);
  });
}
function fillPoolSelect(sel) {
  sel.innerHTML = '';
  state.pools.forEach(function (p) {
    var o = el('option', null, p.name + '（' + p.lane + '）');
    o.value = p.name;
    sel.appendChild(o);
  });
}
function refreshAllSelects() {
  fillEventSelect($('inEvent'), false);
  fillPoolSelect($('inPool'));
  fillEventSelect($('anEvent'), false);
  fillEventSelect($('editEvent'), false);
  fillPoolSelect($('editPool'));
  fillEventSelect($('meetEvent'), false);
}

// =====================================================
// ① 記録入力
// =====================================================

// ---- 形式の切り替え（TT / Short / Middle） ----
function switchFormat(fmt) {
  state.inputFormat = fmt;
  document.querySelectorAll('#formatTabs .format-tab').forEach(function (t) {
    t.classList.toggle('active', t.dataset.format === fmt);
  });
  var isTT = (fmt === 'TT');
  $('ttFields').classList.toggle('hidden', !isTT);
  $('setFields').classList.toggle('hidden', isTT);
  $('formatHint').textContent = isTT
    ? 'TT（タイムトライアル）のみ分析グラフに反映されます'
    : fmt + 'は本数・セットをまとめて記録できます（分析グラフには反映されません）';
  if (isTT) buildTtEntry();
  else updateSetSummary();
}

// ---- ラップ対応のタイム入力コンポーネント ----
// distance が 100以上かつ50の倍数なら 50mごとの経過タイム欄を、そうでなければ単一タイム欄を作る。
// （100m なら 50m・100m の2本）
function lapCount(distance) {
  var d = Number(distance) || 0;
  return (d >= 100 && d % 50 === 0) ? d / 50 : 0;
}
function createTimeEntry(container, distance) {
  container.innerHTML = '';
  var n = lapCount(distance);

  // 合計タイムは常に入力できる（ラップはあくまで任意）
  var total = el('input', 'input');
  total.type = 'text'; total.setAttribute('inputmode', 'decimal');
  total.placeholder = '1.23.45 / 30.20';
  container.appendChild(total);

  if (n === 0) {
    return {
      isEmpty: function () { return total.value.trim() === ''; },
      read: function () {
        var v = total.value.trim();
        parseTimeToSeconds(v); // 検証（不正なら例外）
        return { time: v, laps: null };
      },
      clear: function () { total.value = ''; },
      getTotal: function () { return total.value; },
      setTotal: function (v) { total.value = v || ''; }
    };
  }

  // ---- 200m以上：ラップ入力（任意・折りたたみ） ----
  var toggle = el('button', 'lap-toggle', '＋ ラップ（50mごと）を入力');
  toggle.type = 'button';
  container.appendChild(toggle);

  var wrap = el('div', 'lap-wrap hidden');
  var grid = el('div', 'lap-grid');
  var inputs = [];
  for (var i = 1; i <= n; i++) {
    var cell = el('div', 'lap-cell');
    cell.appendChild(el('span', 'lap-num', (i * 50) + 'm'));
    var inp = el('input', 'input');
    inp.type = 'text'; inp.setAttribute('inputmode', 'decimal');
    inp.placeholder = '経過';
    cell.appendChild(inp);
    grid.appendChild(cell);
    inputs.push(inp);
  }
  var splitView = el('div', 'split-view');
  wrap.appendChild(grid);
  wrap.appendChild(splitView);
  container.appendChild(wrap);

  var open = false;
  toggle.onclick = function () {
    open = !open;
    wrap.classList.toggle('hidden', !open);
    toggle.textContent = open ? '− ラップ入力を閉じる' : '＋ ラップ（50mごと）を入力';
    toggle.classList.toggle('active', open);
  };

  function lapValues() { return inputs.map(function (x) { return x.value.trim(); }); }
  function filledCount() { return lapValues().filter(function (v) { return v !== ''; }).length; }

  // 経過タイムから区間ラップを計算して表示し、最終ラップを合計タイムに反映する
  function recompute() {
    var vals = lapValues(); var parts = []; var prev = 0; var ok = true;
    for (var i = 0; i < vals.length; i++) {
      if (vals[i] === '') break;
      var sec;
      try { sec = parseTimeToSeconds(vals[i]); } catch (e) { ok = false; break; }
      var sp = Math.round((sec - prev) * 100) / 100;
      prev = sec;
      parts.push(((i + 1) * 50) + 'm: ' + formatSeconds(sp < 0 ? 0 : sp));
    }
    if (parts.length && ok) {
      splitView.textContent = '区間ラップ → ' + parts.join(' / ');
      splitView.classList.add('show');
    } else {
      splitView.classList.remove('show');
    }
    // 全て埋まっていれば合計タイム欄を自動更新
    var last = vals[vals.length - 1];
    if (ok && last !== '' && filledCount() === n) total.value = last;
  }
  inputs.forEach(function (x) { x.addEventListener('input', recompute); });

  return {
    isEmpty: function () { return total.value.trim() === '' && filledCount() === 0; },
    read: function () {
      var filled = filledCount();
      if (filled > 0) {
        if (filled < n) {
          throw new Error('ラップは全て入力するか、空にして合計タイムのみで記録してください');
        }
        var vals = lapValues();
        var secs = vals.map(function (v) { return parseTimeToSeconds(v); });
        for (var i = 1; i < secs.length; i++) {
          if (secs[i] < secs[i - 1]) throw new Error('経過タイムは前の区間より大きくしてください');
        }
        return { time: vals[n - 1], laps: vals };
      }
      // ラップ未入力 → 合計タイムのみで記録
      var v = total.value.trim();
      parseTimeToSeconds(v);
      return { time: v, laps: null };
    },
    clear: function () {
      total.value = '';
      inputs.forEach(function (x) { x.value = ''; });
      recompute();
    },
    getTotal: function () { return total.value; },
    setTotal: function (v) { total.value = v || ''; }
  };
}

// TT用のタイム入力欄を（距離に応じて）作り直す。
// 同じラップ構成のままなら作り直さず、入力済みの内容を保持する。
function buildTtEntry() {
  var dist = Number($('inTimeDistance').value) || 0;
  var n = lapCount(dist);
  if (state.ttEntry && state.ttLapN === n) return;
  var prev = state.ttEntry ? state.ttEntry.getTotal() : '';
  state.ttEntry = createTimeEntry($('ttEntry'), dist);
  state.ttEntry.setTotal(prev);
  state.ttLapN = n;
  $('ttLapHint').textContent = n ? '（ラップ入力も可）' : '';
}

// ---- Short / Middle：距離×本数×セットの一括入力 ----
function setDims() {
  var distance = parseInt($('setDistance').value, 10);
  var reps = parseInt($('setReps').value, 10);
  var sets = parseInt($('setSets').value, 10);
  return { distance: distance, reps: reps, sets: sets };
}
function updateSetSummary() {
  var d = setDims();
  if (d.distance > 0 && d.reps > 0 && d.sets > 0) {
    $('setSummary').textContent = d.distance + 'm × ' + d.reps + '本 × ' + d.sets +
      'セット ＝ 全' + (d.reps * d.sets) + '本';
  } else {
    $('setSummary').textContent = '';
  }
}
function buildTimeGrid() {
  var event = $('inEvent').value;
  var pool = $('inPool').value;
  if (!event) { toast('種目を登録・選択してください', true); return; }
  if (!pool) { toast('プールを登録・選択してください', true); return; }
  var d = setDims();
  if (!(d.distance > 0)) { toast('距離を入力してください', true); return; }
  if (!(d.reps > 0)) { toast('本数を入力してください', true); return; }
  if (!(d.sets > 0)) { toast('セット数を入力してください', true); return; }
  if (d.reps * d.sets > 100) { toast('本数×セットが多すぎます（100本以内）', true); return; }

  var isLap = lapCount(d.distance) > 0;
  var grid = $('timeGrid');
  grid.innerHTML = '';
  state.gridEntries = [];
  for (var s = 1; s <= d.sets; s++) {
    var setBox = el('div', 'grid-set');
    if (d.sets > 1) setBox.appendChild(el('div', 'grid-set-title', s + 'セット目'));
    var rows = el('div', isLap ? 'grid-rows-col' : 'grid-rows');
    for (var r = 1; r <= d.reps; r++) {
      var cell = el('div', isLap ? 'grid-rep' : 'grid-cell');
      cell.appendChild(el('span', 'rep-label', r + '本目'));
      var cont = el('div');
      var entry = createTimeEntry(cont, d.distance);
      cell.appendChild(cont);
      state.gridEntries.push({ set: s, rep: r, entry: entry });
      rows.appendChild(cell);
    }
    setBox.appendChild(rows);
    grid.appendChild(setBox);
  }
  $('addGridBtn').classList.remove('hidden');
}
function addGridToPending() {
  var event = $('inEvent').value;
  var pool = $('inPool').value;
  var d = setDims();
  var added = [];
  for (var i = 0; i < state.gridEntries.length; i++) {
    var ge = state.gridEntries[i];
    if (ge.entry.isEmpty()) continue; // 空欄はスキップ（未計測の本があってもOK）
    var res;
    try { res = ge.entry.read(); }
    catch (e) {
      toast((d.sets > 1 ? ge.set + 'セット目' : '') + ge.rep + '本目: ' + e.message, true);
      return;
    }
    added.push({
      event: event, distance: d.distance, time: res.time, laps: res.laps,
      seconds: parseTimeToSeconds(res.time), pool: pool, format: state.inputFormat
    });
  }
  if (!added.length) { toast('タイムを1本以上入力してください', true); return; }
  added.forEach(function (rec) { state.pending.push(rec); });
  $('timeGrid').innerHTML = '';
  state.gridEntries = [];
  $('addGridBtn').classList.add('hidden');
  renderPending();
  toast(added.length + '本を追加しました');
}

function addPendingTime() {
  var event = $('inEvent').value;
  var distance = $('inTimeDistance').value;
  var pool = $('inPool').value;

  if (!event) { toast('種目を登録・選択してください', true); return; }
  if (!distance) { toast('距離を入力してください', true); return; }
  if (!pool) { toast('プールを登録・選択してください', true); return; }
  var res;
  try { res = state.ttEntry.read(); }
  catch (e) { toast(e.message, true); return; }

  state.pending.push({
    event: event, distance: Number(distance), time: res.time, laps: res.laps,
    seconds: parseTimeToSeconds(res.time), pool: pool, format: 'TT'
  });
  state.ttEntry.clear();
  renderPending();
}

function pendingItemHtml(t) {
  return '<span class="ev">' + esc(t.event) + '</span> ' +
    esc(t.distance) + 'm <span class="tm">' + esc(formatSeconds(t.seconds)) + '</span>' +
    '<span class="type-badge ' + esc(t.format) + '">' + esc(t.format) + '</span>' +
    (t.laps && t.laps.length ? '<span class="rec-lap-flag">ラップ</span>' : '') +
    '<div class="sub">' + esc(t.pool) + '</div>';
}

function renderPending() {
  var ul = $('pendingList');
  ul.innerHTML = '';
  state.pending.forEach(function (t, i) {
    var li = el('li');
    var info = el('div', 'pending-info');
    info.innerHTML = pendingItemHtml(t);
    var btn = el('button', 'icon-btn', '✕');
    btn.onclick = function () { state.pending.splice(i, 1); renderPending(); };
    li.appendChild(info); li.appendChild(btn);
    ul.appendChild(li);
  });
}

function savePractice() {
  var date = $('inDate').value;
  if (!date) { toast('日付を入力してください', true); return; }
  var distance = $('inDistance').value;
  if (state.pending.length === 0 && !distance) {
    toast('総距離かタイム記録を入力してください', true); return;
  }
  var payload = {
    date: date,
    distance: distance ? Number(distance) : 0,
    memo: $('inMemo').value,
    times: state.pending.map(function (t) {
      return { event: t.event, distance: t.distance, time: t.time, laps: t.laps, pool: t.pool, format: t.format };
    })
  };
  showLoading(true);
  call('savePractice', [payload]).then(function () {
    showLoading(false);
    toast('保存しました');
    // 入力欄をリセット
    state.pending = [];
    renderPending();
    $('inDistance').value = '';
    $('inMemo').value = '';
    $('inTimeDistance').value = '';
    $('timeGrid').innerHTML = '';
    state.gridEntries = [];
    $('addGridBtn').classList.add('hidden');
    buildTtEntry();
  }).catch(function (err) {
    showLoading(false);
    toast('保存に失敗: ' + err.message, true);
  });
}

// =====================================================
// ② カレンダー（履歴）
// =====================================================
function loadCalendar() {
  if (!state.calYear) {
    var now = new Date();
    state.calYear = now.getFullYear();
    state.calMonth = now.getMonth() + 1;
  }
  showLoading(true);
  Promise.all([
    call('getCalendarMonth', [state.calYear, state.calMonth]),
    call('getRaceCounters', [])
  ]).then(function (res) {
    showLoading(false);
    state.calData = res[0];
    state.races = res[1];
    renderWidgets();
    renderCalendar();
    if (state.calSelectedDate && state.calSelectedDate.indexOf(monthPrefix()) === 0) {
      selectDay(state.calSelectedDate);
    } else {
      state.calSelectedDate = null;
      $('dayDetail').innerHTML = '';
    }
  }).catch(function (err) {
    showLoading(false);
    toast('取得に失敗: ' + err.message, true);
  });
}

function monthPrefix() {
  return state.calYear + '-' + String(state.calMonth).padStart(2, '0');
}
function changeMonth(delta) {
  var m = state.calMonth + delta, y = state.calYear;
  if (m < 1) { m = 12; y--; } else if (m > 12) { m = 1; y++; }
  state.calYear = y; state.calMonth = m;
  loadCalendar();
}
function daysUntil(dateStr) {
  var t = new Date(); t.setHours(0, 0, 0, 0);
  var p = dateStr.split('-');
  var d = new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
  return Math.round((d - t) / 86400000);
}

function renderWidgets() {
  var box = $('calWidgets');
  box.innerHTML = '';
  var wd = el('div', 'widget distance');
  var dist = state.calData ? state.calData.monthDistance : 0;
  wd.innerHTML = '<div class="widget-label">今月の総距離</div>' +
    '<div class="widget-value">' + dist.toLocaleString() + '<small> m</small></div>';
  box.appendChild(wd);

  (state.races || []).forEach(function (r) {
    var left = daysUntil(r.date);
    if (left < 0) return; // 過去は表示しない
    var w = el('div', 'widget race');
    var txt = left === 0 ? '本番！' : 'あと ' + left + '<small> 日</small>';
    w.innerHTML = '<div class="widget-label">' + esc(r.name) + '</div>' +
      '<div class="widget-value">' + txt + '</div>' +
      '<div class="widget-sub">' + esc(r.date) + '</div>';
    var del = el('button', 'wdel', '×');
    del.onclick = function (e) { e.stopPropagation(); deleteRace(r); };
    w.appendChild(del);
    box.appendChild(w);
  });

  var add = el('div', 'widget add', '＋');
  add.title = '大会カウントダウンを追加';
  add.onclick = openRaceModal;
  box.appendChild(add);
}

function renderCalendar() {
  $('calMonthLabel').textContent = state.calYear + '年' + state.calMonth + '月';
  var grid = $('calGrid');
  grid.innerHTML = '';
  var startDow = new Date(state.calYear, state.calMonth - 1, 1).getDay();
  var daysInMonth = new Date(state.calYear, state.calMonth, 0).getDate();
  var today = todayStr();
  var days = (state.calData && state.calData.days) || {};

  for (var i = 0; i < startDow; i++) grid.appendChild(el('div', 'cal-day empty'));

  for (var day = 1; day <= daysInMonth; day++) {
    var dateStr = monthPrefix() + '-' + String(day).padStart(2, '0');
    var dow = new Date(state.calYear, state.calMonth - 1, day).getDay();
    var cls = 'cal-day';
    if (dow === 0) cls += ' sun';
    if (dow === 6) cls += ' sat';
    if (dateStr === today) cls += ' today';
    var info = days[dateStr];
    if (info) cls += ' has-practice';
    if (dateStr === state.calSelectedDate) cls += ' selected';
    var cell = el('div', cls);
    cell.appendChild(el('span', 'dnum', String(day)));
    if (info) {
      cell.appendChild(el('span', 'dmark'));
      if (info.distance) cell.appendChild(el('span', 'ddist', info.distance + 'm'));
    }
    (function (ds) { cell.onclick = function () { selectDay(ds); }; })(dateStr);
    grid.appendChild(cell);
  }
}

// ---- 編集モーダル ----
function buildEditEntry(force) {
  var dist = Number($('editTimeDistance').value) || 0;
  var n = lapCount(dist);
  if (!force && state.editEntry && state.editLapN === n) return;
  var prev = (!force && state.editEntry) ? state.editEntry.getTotal() : '';
  state.editEntry = createTimeEntry($('editEntry'), dist);
  state.editEntry.setTotal(prev);
  state.editLapN = n;
  $('editLapHint').textContent = n ? '（ラップ入力も可）' : '';
}
function openEdit(log) {
  state.editLogId = log.id;
  // 既存タイムは laps を「累積タイム文字列の配列」に変換して保持（再保存時にそのまま渡す）
  state.editTimes = log.times.map(function (t) {
    var lapStrs = (t.laps && t.laps.length) ? t.laps.map(function (l) { return l.cumText; }) : null;
    return {
      event: t.event, distance: t.distance, time: t.timeText, laps: lapStrs,
      seconds: t.seconds, pool: t.pool, format: t.format || 'TT'
    };
  });
  $('editDate').value = log.date;
  $('editDistance').value = log.distance;
  $('editMemo').value = log.memo;
  $('editTimeDistance').value = '';
  buildEditEntry(true);
  renderEditTimes();
  $('editOverlay').classList.add('show');
}
function closeEdit() {
  $('editOverlay').classList.remove('show');
  state.editLogId = null;
  state.editTimes = [];
}
function renderEditTimes() {
  var ul = $('editTimeList');
  ul.innerHTML = '';
  state.editTimes.forEach(function (t, i) {
    var li = el('li');
    var info = el('div', 'pending-info');
    info.innerHTML = pendingItemHtml(t);
    var btn = el('button', 'icon-btn', '✕');
    btn.onclick = function () { state.editTimes.splice(i, 1); renderEditTimes(); };
    li.appendChild(info); li.appendChild(btn);
    ul.appendChild(li);
  });
}
function addEditTime() {
  var event = $('editEvent').value;
  var distance = $('editTimeDistance').value;
  var pool = $('editPool').value;
  var format = $('editFormat').value;
  if (!event) { toast('種目を選択してください', true); return; }
  if (!distance) { toast('距離を入力してください', true); return; }
  if (!pool) { toast('プールを選択してください', true); return; }
  var res;
  try { res = state.editEntry.read(); }
  catch (e) { toast(e.message, true); return; }
  state.editTimes.push({
    event: event, distance: Number(distance), time: res.time, laps: res.laps,
    seconds: parseTimeToSeconds(res.time), pool: pool, format: format
  });
  $('editTimeDistance').value = '';
  buildEditEntry(true);
  renderEditTimes();
}
function saveEdit() {
  var date = $('editDate').value;
  if (!date) { toast('日付を入力してください', true); return; }
  var payload = {
    id: state.editLogId,
    date: date,
    distance: $('editDistance').value ? Number($('editDistance').value) : 0,
    memo: $('editMemo').value,
    times: state.editTimes.map(function (t) {
      return { event: t.event, distance: t.distance, time: t.time, laps: t.laps, pool: t.pool, format: t.format || 'TT' };
    })
  };
  showLoading(true);
  call('savePractice', [payload]).then(function () {
    showLoading(false);
    toast('更新しました');
    closeEdit();
    loadCalendar();
  }).catch(function (err) {
    showLoading(false);
    toast('更新に失敗: ' + err.message, true);
  });
}

// =====================================================
function destroyChart() { if (state.chart) { state.chart.destroy(); state.chart = null; } }
function showAnalysisEmpty(msg) {
  var e = $('analysisEmpty');
  e.textContent = msg;
  e.classList.remove('hidden');
}
function hideAnalysisEmpty() { $('analysisEmpty').classList.add('hidden'); }

// タイム推移 / 総距離推移 の切替
function switchAnalysisMode(mode) {
  state.analysisMode = mode;
  document.querySelectorAll('#analysisModeTabs .format-tab').forEach(function (t) {
    t.classList.toggle('active', t.dataset.mode === mode);
  });
  var isTime = (mode === 'time');
  $('anTimeFilters').classList.toggle('hidden', !isTime);
  $('chartLegend').classList.toggle('hidden', !isTime);
  $('chartHint').textContent = isTime
    ? '↑ 上にいくほど速い（タイムが小さい）'
    : '日ごとの総距離(m)の推移';

// 分析画面に入ったとき／モード切替時の起点
function enterAnalysis() {
  if (state.analysisMode === 'distance') { loadAnalysis(); }
  else { loadAnalysisDistances(true); }
}

// 選択中の種目で記録のある距離を取得し、距離プルダウンを更新する
function loadAnalysisDistances(preserve) {
  var eventName = $('anEvent').value;
  var sel = $('anDistance');
  if (!eventName) { sel.innerHTML = ''; loadAnalysis(); return; }
  var prev = sel.value;
  showLoading(true);
  call('getEventDistances', [eventName]).then(function (dists) {
    showLoading(false);
    sel.innerHTML = '';
    if (!dists.length) {
      var o = el('option', null, '記録なし'); o.value = '';
      sel.appendChild(o);
    } else {
      dists.forEach(function (d) {
        var o = el('option', null, d + 'm'); o.value = d;
        sel.appendChild(o);
      });
      if (preserve && dists.indexOf(Number(prev)) >= 0) sel.value = prev;
    }
    loadAnalysis();
  }).catch(function (err) {
    showLoading(false);
    toast('取得に失敗: ' + err.message, true);
  });
}

function loadAnalysis() {
  if (state.analysisMode === 'distance') {
    showLoading(true);
    call('getDistanceTrend', [state.analysisPeriod]).then(function (points) {
      showLoading(false);
      renderDistanceChart(points);
    }).catch(function (err) {
      showLoading(false);
      toast('取得に失敗: ' + err.message, true);
    });
    return;
  }
  // タイム推移
  var eventName = $('anEvent').value;
  if (!eventName) {
    destroyChart();
    showAnalysisEmpty('種目を登録・選択してください');
    return;
  }
  var distance = $('anDistance').value ? Number($('anDistance').value) : 0;
  var lane = $('anLane').value;
  showLoading(true);
  call('getAnalysisData', [eventName, distance, lane, state.analysisPeriod]).then(function (data) {
    showLoading(false);
    renderTimeChart(data);
  }).catch(function (err) {
    showLoading(false);
    toast('取得に失敗: ' + err.message, true);
  });
}

// 練習(TT)＝青丸、試合＝赤丸を重ねて描画
function renderTimeChart(data) {
  var practice = (data && data.practice) || [];
  var meet = (data && data.meet) || [];
  if (!practice.length && !meet.length) {
    destroyChart();
    showAnalysisEmpty('該当する記録がありません');
    return;
  }
  hideAnalysisEmpty();

  // 日付をユニークな昇順リストにし、その並び順(index)をX座標に使う。
  // これにより同じ日の記録は同じX座標（同じ縦線上）に重なる。
  var dateSet = {};
  practice.forEach(function (p) { dateSet[p.date] = true; });
  meet.forEach(function (m) { dateSet[m.date] = true; });
  var dates = Object.keys(dateSet).sort();
  var idx = {};
  dates.forEach(function (d, i) { idx[d] = i; });

  var practicePoints = practice.map(function (p) {
    return { x: idx[p.date], y: p.seconds, _ref: p, _kind: 'practice' };
  });
  var meetPoints = meet.map(function (m) {
    return { x: idx[m.date], y: m.seconds, _ref: m, _kind: 'meet' };
  });

  destroyChart();
  var ctx = $('analysisChart').getContext('2d');
  state.chart = new Chart(ctx, {
    type: 'line',
    data: {
      datasets: [
        {
          label: '練習(TT)', data: practicePoints,
          borderColor: '#1789c9', backgroundColor: 'rgba(23,137,201,.12)',
          borderWidth: 2.5, pointRadius: 5, pointHoverRadius: 7,
          pointBackgroundColor: '#0f5c8c', tension: 0.2, showLine: true, fill: false
        },
        {
          label: '試合', data: meetPoints,
          borderColor: '#e74c3c', backgroundColor: '#e74c3c', showLine: false,
          pointRadius: 6, pointHoverRadius: 8, pointBackgroundColor: '#e74c3c'
        }
      ]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      scales: {
        y: {
          reverse: true, // 上に行くほどタイムが小さい＝速い
          title: { display: true, text: 'タイム(秒)　上ほど速い' },
          ticks: { callback: function (v) { return formatSeconds(v); } }
        },
        x: {
          type: 'linear',
          min: -0.5, max: dates.length - 0.5,
          ticks: {
            stepSize: 1, autoSkip: true, maxTicksLimit: 8, maxRotation: 60, minRotation: 0,
            callback: function (v) { return (v === Math.round(v)) ? (dates[v] || '') : ''; }
          }
        }
      },
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            title: function (items) { var r = items[0].raw; return (r && r._ref) ? r._ref.date : ''; },
            label: function (item) {
              var c = item.raw;
              var p = c._ref;
              if (c._kind === 'meet') {
                return ['🏅 ' + (p.meetName || '試合') + '（' + (p.kind || '正式') + '）',
                        '距離: ' + p.distance + 'm',
                        'タイム: ' + p.timeText, '水路: ' + (p.lane || '-')];
              }
              return ['練習(TT)', '距離: ' + p.distance + 'm', 'タイム: ' + p.timeText,
                      'プール: ' + (p.pool || '-') + (p.lane ? '（' + p.lane + '）' : '')];
            }
          }
        }
      }
    }
  });
}

// 総距離の推移（緑の折れ線、Y軸は通常向き）
function renderDistanceChart(points) {
  if (!points.length) {
    destroyChart();
    showAnalysisEmpty('該当する記録がありません');
    return;
  }
  hideAnalysisEmpty();
  var labels = points.map(function (p) { return p.date; });
  var data = points.map(function (p) { return p.distance; });

  destroyChart();
  var ctx = $('analysisChart').getContext('2d');
  state.chart = new Chart(ctx, {
    type: 'line',
    data: {
      labels: labels,
      datasets: [{
        label: '総距離(m)', data: data,
        borderColor: '#00b894', backgroundColor: 'rgba(0,184,148,.15)',
        borderWidth: 2.5, pointRadius: 5, pointHoverRadius: 7,
        pointBackgroundColor: '#009e80', tension: 0.2, fill: true
      }]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      scales: {
        y: { beginAtZero: true, title: { display: true, text: '総距離 (m)' } },
        x: { ticks: { maxRotation: 60, minRotation: 0, autoSkip: true, maxTicksLimit: 8 } }
      },
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            label: function (item) { return '総距離: ' + points[item.dataIndex].distance + 'm'; }
          }
        }
      }
    }
  });
}

  showLoading(true);
  call('getBestTimes', [state.bestLane]).then(function (best) {

    renderBest(best || {});
  }).catch(function (err) {
    showLoading(false);

  });

function renderBest(best) {
  var container = $('bestTables');
  container.innerHTML = '';

  Object.keys(BEST_SCHEMA).forEach(function (kind) {
    var schema = BEST_SCHEMA[kind];

    var block = el('div', 'best-block');
    block.appendChild(el('div', 'best-caption', kind + '記録'));

    var scroll = el('div', 'best-scroll');
    var table = el('table', 'best-table');

    // ヘッダー（距離）
    var thead = el('thead');
    var htr = el('tr');
    htr.appendChild(el('th', 'corner', '種目＼距離'));
    schema.columns.forEach(function (d) { htr.appendChild(el('th', null, d + 'm')); });
    thead.appendChild(htr);
    table.appendChild(thead);

    // 本体（種目 × 距離）
    var tbody = el('tbody');
    schema.rows.forEach(function (rowDef) {
      var tr = el('tr');
      tr.appendChild(el('th', 'row-head', rowDef.event));
      schema.columns.forEach(function (d) {
        var td = el('td');
        if (rowDef.dists.indexOf(d) < 0) {
          td.className = 'na';                 // 対象外（例: 引継ぎのBr/Fly 200m）
        } else {
          var rec = best[kind + '|' + rowDef.event + '|' + d];
          if (rec) {
            var btn = el('button', 'best-cell', rec.timeText);
            (function (info) {
              btn.onclick = function () { openBestDetail(info); };
            })({ kind: kind, event: rowDef.event, distance: d, rec: rec });
            td.appendChild(btn);
          } else {
            td.className = 'empty';
            td.textContent = '—';
          }
        }
        tr.appendChild(td);
      });
      tbody.appendChild(tr);
    });
    table.appendChild(tbody);
    scroll.appendChild(table);
    block.appendChild(scroll);
    container.appendChild(block);
  });
}

function openBestDetail(info) {
  var rec = info.rec;
  $('bdTitle').textContent = info.event + ' ' + info.distance + 'm';
  var rows = [
    ['タイム', '<span class="bd-time">' + esc(rec.timeText) + '</span>'],
    ['種別', esc(info.kind)],
    ['大会名', esc(rec.meetName || '（未入力）')],
    ['日付', esc(rec.date)],
    ['水路タイプ', esc(rec.lane || '-')]
  ];
  $('bdBody').innerHTML = rows.map(function (r) {
    return '<dt>' + r[0] + '</dt><dd>' + r[1] + '</dd>';
  }).join('');
  $('bestDetailOverlay').classList.add('show');
}
function closeBestDetail() { $('bestDetailOverlay').classList.remove('show'); }

// =====================================================
// ④ 種目マスタ
// =====================================================
function renderEventMaster() {
  var ul = $('eventList');
  ul.innerHTML = '';
  if (!state.events.length) {
    ul.appendChild(el('div', 'empty-hint', '種目がありません。追加してください。'));
    return;
  }
  state.events.forEach(function (ev) {
    var li = el('li');
    li.appendChild(el('span', 'master-name', ev.name));
    var btn = el('button', 'archive-btn', 'アーカイブ');
    btn.onclick = function () { archiveEvent(ev); };
    li.appendChild(btn);
    ul.appendChild(li);
  });
}
function addEvent() {
  var name = $('newEventName').value.trim();
  if (!name) { toast('種目名を入力してください', true); return; }
  showLoading(true);
  call('addEvent', [name]).then(function (events) {
    showLoading(false);
    state.events = events;
    $('newEventName').value = '';
    refreshAllSelects();
    renderEventMaster();
    toast('追加しました');
  }).catch(function (err) {
    showLoading(false);
    toast(err.message, true);
  });
}
function archiveEvent(ev) {
  if (!confirm('「' + ev.name + '」をアーカイブしますか？（過去のタイム記録は残ります）')) return;
  showLoading(true);
  call('archiveEvent', [ev.id]).then(function (events) {
    showLoading(false);
    state.events = events;
    refreshAllSelects();
    renderEventMaster();
    toast('アーカイブしました');
  }).catch(function (err) {
    showLoading(false);
    toast(err.message, true);
  });
}

// ⑤ プールマスタ

function renderPoolMaster() {
  var ul = $('poolList');
  ul.innerHTML = '';
  if (!state.pools.length) {
    ul.appendChild(el('div', 'empty-hint', 'プールがありません。追加してください。'));

  }
  state.pools.forEach(function (p) {
    var li = el('li');
    var name = el('span', 'master-name', p.name);
    var sub = el('span', 'master-sub', p.lane);
    var left = el('div');
    left.appendChild(name); left.appendChild(sub);
    li.appendChild(left);
    var btn = el('button', 'archive-btn', 'アーカイブ');
    btn.onclick = function () { archivePool(p); };
    li.appendChild(btn);
    ul.appendChild(li);

}
function addPool() {
  var name = $('newPoolName').value.trim();

// =====================================================
// イベント登録 & 初期化
// =====================================================
function bindEvents() {
  $('menuBtn').onclick = function () { openDrawer(!$('drawer').classList.contains('open')); };
  $('drawerOverlay').onclick = function () { openDrawer(false); };
  document.querySelectorAll('.nav-item').forEach(function (n) {
    n.onclick = function () { switchScreen(n.dataset.screen); };
  });

  // 記録入力
  document.querySelectorAll('#formatTabs .format-tab').forEach(function (tab) {
    tab.onclick = function () { switchFormat(tab.dataset.format); };
  });
  $('addTimeBtn').onclick = addPendingTime;
  $('buildGridBtn').onclick = buildTimeGrid;
  $('addGridBtn').onclick = addGridToPending;
  ['setDistance', 'setReps', 'setSets'].forEach(function (id) {
    $(id).addEventListener('input', updateSetSummary);
  });
  $('inTimeDistance').addEventListener('input', function () { buildTtEntry(); });
  $('savePracticeBtn').onclick = savePractice;

  // カレンダー
  $('calPrev').onclick = function () { changeMonth(-1); };
  $('calNext').onclick = function () { changeMonth(1); };

  // 記録詳細（ラップ）モーダル
  $('rdCloseBtn').onclick = closeRecordDetail;
  $('recDetailOverlay').onclick = function (e) { if (e.target === $('recDetailOverlay')) closeRecordDetail(); };

  // 大会カウントダウン モーダル
  $('raceSaveBtn').onclick = saveRace;
  $('raceCancelBtn').onclick = closeRaceModal;
  $('raceOverlay').onclick = function (e) { if (e.target === $('raceOverlay')) closeRaceModal(); };

  // 編集モーダル
  $('editAddTimeBtn').onclick = addEditTime;
  $('editCancelBtn').onclick = closeEdit;
  $('editSaveBtn').onclick = saveEdit;
  $('editTimeDistance').addEventListener('input', function () { buildEditEntry(); });
  $('editOverlay').onclick = function (e) { if (e.target === $('editOverlay')) closeEdit(); };

  // 分析
  document.querySelectorAll('#analysisModeTabs .format-tab').forEach(function (tab) {
    tab.onclick = function () { switchAnalysisMode(tab.dataset.mode); };
  });
  $('anEvent').onchange = function () { loadAnalysisDistances(false); };
  $('anDistance').onchange = loadAnalysis;
  $('anLane').onchange = loadAnalysis;
  document.querySelectorAll('.period-tab').forEach(function (tab) {
    tab.onclick = function () {
      document.querySelectorAll('.period-tab').forEach(function (t) { t.classList.remove('active'); });
      tab.classList.add('active');
      state.analysisPeriod = tab.dataset.period;
      loadAnalysis();
    };
  });

  // 試合記録
  $('saveMeetBtn').onclick = saveMeet;

  // ベスト表
  document.querySelectorAll('#bestLaneTabs .format-tab').forEach(function (tab) {
    tab.onclick = function () { switchBestLane(tab.dataset.lane); };
  });
  $('bdCloseBtn').onclick = closeBestDetail;
  $('bestDetailOverlay').onclick = function (e) {
    if (e.target === $('bestDetailOverlay')) closeBestDetail();
  };

  // マスタ
  $('addEventBtn').onclick = addEvent;
  $('addPoolBtn').onclick = addPool;
  $('newEventName').addEventListener('keydown', function (e) { if (e.key === 'Enter') addEvent(); });
  $('newPoolName').addEventListener('keydown', function (e) { if (e.key === 'Enter') addPool(); });
}

function init() {
  $('inDate').value = todayStr();
  bindEvents();
  showLoading(true);
  call('getMasters', []).then(function (m) {
    showLoading(false);
    state.events = m.events || [];
    state.pools = m.pools || [];
    refreshAllSelects();
    buildTtEntry();
  }).catch(function (err) {
    showLoading(false);
    toast('初期化に失敗: ' + err.message, true);
  });
}

window.addEventListener('DOMContentLoaded', init);
</script>
