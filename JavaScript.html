<script>
// =====================================================
// 水泳練習記録アプリ クライアントJS
// =====================================================

// ---- 状態 ----
var state = {
  events: [],          // 有効な種目マスタ
  pools: [],           // 有効なプールマスタ
  pending: [],         // 入力画面で追加待ちのタイム記録
  inputFormat: 'TT',   // 記録入力画面で選択中の形式（TT / Short / Middle）
  editTimes: [],       // 編集モーダル内のタイム記録
  editLogId: null,
  analysisPeriod: 'all',
  analysisMode: 'time',   // 'time'（タイム推移） | 'distance'（総距離推移）
  historyLogs: [],        // 履歴タブで読み込んだログ（日付絞り込み用に保持）
  chart: null
};

// ---- ショートカット ----
function $(id) { return document.getElementById(id); }
function el(tag, cls, text) {
  var e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}
function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
function todayStr() {
  var d = new Date();
  var m = String(d.getMonth() + 1).padStart(2, '0');
  var day = String(d.getDate()).padStart(2, '0');
  return d.getFullYear() + '-' + m + '-' + day;
}

// ---- ローディング / トースト ----
function showLoading(b) { $('loading').classList.toggle('show', b); }
function toast(msg, isError) {
  var t = $('toast');
  t.textContent = msg;
  t.className = 'toast show' + (isError ? ' error' : '');
  setTimeout(function () { t.className = 'toast'; }, 2600);
}

// ---- サーバー呼び出しをPromise化 ----
function call(fn, args) {
  return new Promise(function (resolve, reject) {
    google.script.run
      .withSuccessHandler(resolve)
      .withFailureHandler(reject)[fn].apply(google.script.run, args || []);
  });
}

// =====================================================
// タイム変換（クライアント側：追加時の即時検証・表示用）
// =====================================================
function parseTimeToSeconds(input) {
  var s = String(input == null ? '' : input).trim();
  if (s === '') throw new Error('タイムを入力してください');
  if (/^\d+(\.\d+)?$/.test(s)) {
    var v = Number(s);
    if (v < 0) throw new Error('タイムは0以上で入力してください');
    return Math.round(v * 100) / 100;
  }
  var m = s.match(/^(\d+):([0-5]?\d)(\.\d+)?$/);
  if (!m) throw new Error('タイムの形式が不正です（例: 1:19.50 または 30.20）');
  var total = parseInt(m[1], 10) * 60 + parseInt(m[2], 10) + (m[3] ? parseFloat(m[3]) : 0);
  return Math.round(total * 100) / 100;
}
function formatSeconds(sec) {
  var v = Number(sec) || 0;
  if (v >= 60) {
    var mm = Math.floor(v / 60);
    var ss = (v - mm * 60).toFixed(2);
    if (ss.length < 5) ss = '0' + ss;
    return mm + ':' + ss;
  }
  return v.toFixed(2);
}

// =====================================================
// ナビゲーション（ドロワー + SPA切替）
// =====================================================
var TITLES = { input: '記録入力', history: '履歴一覧', analysis: '分析', meets: '試合記録', events: '種目マスタ', pools: 'プールマスタ' };

function openDrawer(b) {
  $('drawer').classList.toggle('open', b);
  $('drawerOverlay').classList.toggle('show', b);
}
function switchScreen(name) {
  document.querySelectorAll('.screen').forEach(function (s) { s.classList.remove('active'); });
  $(name).classList.add('active');
  document.querySelectorAll('.nav-item').forEach(function (n) {
    n.classList.toggle('active', n.dataset.screen === name);
  });
  $('screenTitle').textContent = TITLES[name] || '';
  openDrawer(false);
  onScreenEnter(name);
}
function onScreenEnter(name) {
  if (name === 'history') loadHistory();
  else if (name === 'analysis') loadAnalysis();
  else if (name === 'meets') loadMeets();
  else if (name === 'events') renderEventMaster();
  else if (name === 'pools') renderPoolMaster();
}

// =====================================================
// マスタのプルダウン反映
// =====================================================
function fillEventSelect(sel, includeAllOption) {
  sel.innerHTML = '';
  if (includeAllOption) {
    var o = el('option', null, 'すべて');
    o.value = '';
    sel.appendChild(o);
  }
  state.events.forEach(function (ev) {
    var o = el('option', null, ev.name);
    o.value = ev.name;
    sel.appendChild(o);
  });
}
function fillPoolSelect(sel) {
  sel.innerHTML = '';
  state.pools.forEach(function (p) {
    var o = el('option', null, p.name + '（' + p.lane + '）');
    o.value = p.name;
    sel.appendChild(o);
  });
}
function refreshAllSelects() {
  fillEventSelect($('inEvent'), false);
  fillPoolSelect($('inPool'));
  fillEventSelect($('historyFilter'), true);
  fillEventSelect($('anEvent'), false);
  fillEventSelect($('editEvent'), false);
  fillPoolSelect($('editPool'));
  fillEventSelect($('meetEvent'), false);
}

// =====================================================
// ① 記録入力
// =====================================================

// ---- 形式の切り替え（TT / Short / Middle） ----
function switchFormat(fmt) {
  state.inputFormat = fmt;
  document.querySelectorAll('#formatTabs .format-tab').forEach(function (t) {
    t.classList.toggle('active', t.dataset.format === fmt);
  });
  var isTT = (fmt === 'TT');
  $('ttFields').classList.toggle('hidden', !isTT);
  $('setFields').classList.toggle('hidden', isTT);
  $('formatHint').textContent = isTT
    ? 'TT（タイムトライアル）のみ分析グラフに反映されます'
    : fmt + 'は本数・セットをまとめて記録できます（分析グラフには反映されません）';
  if (!isTT) updateSetSummary();
}

// ---- Short / Middle：距離×本数×セットの一括入力 ----
function setDims() {
  var distance = parseInt($('setDistance').value, 10);
  var reps = parseInt($('setReps').value, 10);
  var sets = parseInt($('setSets').value, 10);
  return { distance: distance, reps: reps, sets: sets };
}
function updateSetSummary() {
  var d = setDims();
  if (d.distance > 0 && d.reps > 0 && d.sets > 0) {
    $('setSummary').textContent = d.distance + 'm × ' + d.reps + '本 × ' + d.sets +
      'セット ＝ 全' + (d.reps * d.sets) + '本';
  } else {
    $('setSummary').textContent = '';
  }
}
function buildTimeGrid() {
  var event = $('inEvent').value;
  var pool = $('inPool').value;
  if (!event) { toast('種目を登録・選択してください', true); return; }
  if (!pool) { toast('プールを登録・選択してください', true); return; }
  var d = setDims();
  if (!(d.distance > 0)) { toast('距離を入力してください', true); return; }
  if (!(d.reps > 0)) { toast('本数を入力してください', true); return; }
  if (!(d.sets > 0)) { toast('セット数を入力してください', true); return; }
  if (d.reps * d.sets > 100) { toast('本数×セットが多すぎます（100本以内）', true); return; }

  var grid = $('timeGrid');
  grid.innerHTML = '';
  for (var s = 1; s <= d.sets; s++) {
    var setBox = el('div', 'grid-set');
    if (d.sets > 1) setBox.appendChild(el('div', 'grid-set-title', s + 'セット目'));
    var rows = el('div', 'grid-rows');
    for (var r = 1; r <= d.reps; r++) {
      var cell = el('div', 'grid-cell');
      cell.appendChild(el('span', 'rep-label', r + '本目'));
      var input = el('input', 'input');
      input.type = 'text';
      input.setAttribute('inputmode', 'decimal');
      input.placeholder = '1:19.50';
      input.dataset.set = s;
      input.dataset.rep = r;
      cell.appendChild(input);
      rows.appendChild(cell);
    }
    setBox.appendChild(rows);
    grid.appendChild(setBox);
  }
  $('addGridBtn').classList.remove('hidden');
}
function addGridToPending() {
  var event = $('inEvent').value;
  var pool = $('inPool').value;
  var d = setDims();
  var inputs = $('timeGrid').querySelectorAll('input');
  var added = [];
  for (var i = 0; i < inputs.length; i++) {
    var raw = inputs[i].value.trim();
    if (raw === '') continue; // 空欄はスキップ（未計測の本があってもOK）
    var seconds;
    try { seconds = parseTimeToSeconds(raw); }
    catch (e) {
      toast(inputs[i].dataset.set + 'セット目' + inputs[i].dataset.rep + '本目: ' + e.message, true);
      return;
    }
    added.push({
      event: event, distance: d.distance, time: raw, seconds: seconds,
      pool: pool, format: state.inputFormat
    });
  }
  if (!added.length) { toast('タイムを1本以上入力してください', true); return; }
  added.forEach(function (rec) { state.pending.push(rec); });
  // グリッドをリセット
  $('timeGrid').innerHTML = '';
  $('addGridBtn').classList.add('hidden');
  renderPending();
  toast(added.length + '本を追加しました');
}

function addPendingTime() {
  var event = $('inEvent').value;
  var distance = $('inTimeDistance').value;
  var timeRaw = $('inTime').value;
  var pool = $('inPool').value;

  if (!event) { toast('種目を登録・選択してください', true); return; }
  if (!distance) { toast('距離を入力してください', true); return; }
  if (!pool) { toast('プールを登録・選択してください', true); return; }
  var seconds;
  try { seconds = parseTimeToSeconds(timeRaw); }
  catch (e) { toast(e.message, true); return; }

  state.pending.push({
    event: event, distance: Number(distance), time: timeRaw.trim(),
    seconds: seconds, pool: pool, format: 'TT'
  });
  $('inTimeDistance').value = '';
  $('inTime').value = '';
  renderPending();
}

function pendingItemHtml(t) {
  return '<span class="ev">' + esc(t.event) + '</span> ' +
    esc(t.distance) + 'm <span class="tm">' + esc(formatSeconds(t.seconds)) + '</span>' +
    '<span class="type-badge ' + esc(t.format) + '">' + esc(t.format) + '</span>' +
    '<div class="sub">' + esc(t.pool) + '</div>';
}

function renderPending() {
  var ul = $('pendingList');
  ul.innerHTML = '';
  state.pending.forEach(function (t, i) {
    var li = el('li');
    var info = el('div', 'pending-info');
    info.innerHTML = pendingItemHtml(t);
    var btn = el('button', 'icon-btn', '✕');
    btn.onclick = function () { state.pending.splice(i, 1); renderPending(); };
    li.appendChild(info); li.appendChild(btn);
    ul.appendChild(li);
  });
}

function savePractice() {
  var date = $('inDate').value;
  if (!date) { toast('日付を入力してください', true); return; }
  var distance = $('inDistance').value;
  if (state.pending.length === 0 && !distance) {
    toast('総距離かタイム記録を入力してください', true); return;
  }
  var payload = {
    date: date,
    distance: distance ? Number(distance) : 0,
    memo: $('inMemo').value,
    times: state.pending.map(function (t) {
      return { event: t.event, distance: t.distance, time: t.time, pool: t.pool, format: t.format };
    })
  };
  showLoading(true);
  call('savePractice', [payload]).then(function () {
    showLoading(false);
    toast('保存しました');
    // 入力欄をリセット
    state.pending = [];
    renderPending();
    $('inDistance').value = '';
    $('inMemo').value = '';
    $('inTimeDistance').value = '';
    $('inTime').value = '';
    $('timeGrid').innerHTML = '';
    $('addGridBtn').classList.add('hidden');
  }).catch(function (err) {
    showLoading(false);
    toast('保存に失敗: ' + err.message, true);
  });
}

// =====================================================
// ② 履歴一覧
// =====================================================
function loadHistory() {
  var filter = $('historyFilter').value || null;
  showLoading(true);
  call('getHistory', [filter]).then(function (logs) {
    showLoading(false);
    state.historyLogs = logs;
    applyHistoryDateFilter();
  }).catch(function (err) {
    showLoading(false);
    toast('取得に失敗: ' + err.message, true);
  });
}

// 日付ピッカーの値で履歴を絞り込んで表示
function applyHistoryDateFilter() {
  var date = $('historyDate').value;
  $('historyClearDate').classList.toggle('hidden', !date);
  var logs = state.historyLogs;
  if (date) logs = logs.filter(function (l) { return l.date === date; });
  renderHistory(logs);
}

function renderHistory(logs) {
  var box = $('historyList');
  box.innerHTML = '';
  if (!logs.length) {
    box.appendChild(el('div', 'empty-hint', '記録がありません'));
    return;
  }
  logs.forEach(function (log) {
    var card = el('div', 'history-card');

    var head = el('div', 'history-head');
    head.innerHTML = '<span class="history-date">' + esc(log.date) + '</span>' +
      '<span class="history-dist">総距離 ' + esc(log.distance) + 'm</span>';
    card.appendChild(head);

    if (log.memo) {
      card.appendChild(el('div', 'history-memo', log.memo));
    }

    if (log.times.length) {
      var table = el('table', 'time-table');
      table.innerHTML = '<thead><tr><th>種目</th><th>距離</th><th>タイム</th><th>プール</th><th></th></tr></thead>';
      var tb = el('tbody');
      log.times.forEach(function (t) {
        var tr = el('tr');
        tr.innerHTML = '<td>' + esc(t.event) + '</td><td>' + esc(t.distance) + 'm</td>' +
          '<td>' + esc(t.timeText) + '</td><td>' + esc(t.pool) + '</td>';
        var tdDel = el('td');
        var del = el('button', 'del-tm', '🗑');
        del.title = 'このタイム記録を削除';
        del.onclick = function () { deleteTimeRecord(t.id); };
        tdDel.appendChild(del);
        tr.appendChild(tdDel);
        tb.appendChild(tr);
      });
      table.appendChild(tb);
      card.appendChild(table);
    }

    var actions = el('div', 'history-actions');
    var editBtn = el('button', 'btn secondary', '編集');
    editBtn.onclick = function () { openEdit(log); };
    var delBtn = el('button', 'btn danger', '削除');
    delBtn.onclick = function () { deletePractice(log); };
    actions.appendChild(editBtn);
    actions.appendChild(delBtn);
    card.appendChild(actions);

    box.appendChild(card);
  });
}

function deletePractice(log) {
  if (!confirm(log.date + ' の練習記録を削除します。よろしいですか？（タイム記録も全て削除されます）')) return;
  showLoading(true);
  call('deletePractice', [log.id]).then(function () {
    showLoading(false);
    toast('削除しました');
    loadHistory();
  }).catch(function (err) {
    showLoading(false);
    toast('削除に失敗: ' + err.message, true);
  });
}

function deleteTimeRecord(id) {
  if (!confirm('このタイム記録を削除しますか？')) return;
  showLoading(true);
  call('deleteTimeRecord', [id]).then(function () {
    showLoading(false);
    toast('削除しました');
    loadHistory();
  }).catch(function (err) {
    showLoading(false);
    toast('削除に失敗: ' + err.message, true);
  });
}

// ---- 編集モーダル ----
function openEdit(log) {
  state.editLogId = log.id;
  state.editTimes = log.times.map(function (t) {
    return { event: t.event, distance: t.distance, time: t.timeText, seconds: t.seconds, pool: t.pool, format: t.format || 'TT' };
  });
  $('editDate').value = log.date;
  $('editDistance').value = log.distance;
  $('editMemo').value = log.memo;
  renderEditTimes();
  $('editOverlay').classList.add('show');
}
function closeEdit() {
  $('editOverlay').classList.remove('show');
  state.editLogId = null;
  state.editTimes = [];
}
function renderEditTimes() {
  var ul = $('editTimeList');
  ul.innerHTML = '';
  state.editTimes.forEach(function (t, i) {
    var li = el('li');
    var info = el('div', 'pending-info');
    info.innerHTML = pendingItemHtml(t);
    var btn = el('button', 'icon-btn', '✕');
    btn.onclick = function () { state.editTimes.splice(i, 1); renderEditTimes(); };
    li.appendChild(info); li.appendChild(btn);
    ul.appendChild(li);
  });
}
function addEditTime() {
  var event = $('editEvent').value;
  var distance = $('editTimeDistance').value;
  var timeRaw = $('editTime').value;
  var pool = $('editPool').value;
  var format = $('editFormat').value;
  if (!event) { toast('種目を選択してください', true); return; }
  if (!distance) { toast('距離を入力してください', true); return; }
  if (!pool) { toast('プールを選択してください', true); return; }
  var seconds;
  try { seconds = parseTimeToSeconds(timeRaw); }
  catch (e) { toast(e.message, true); return; }
  state.editTimes.push({ event: event, distance: Number(distance), time: timeRaw.trim(), seconds: seconds, pool: pool, format: format });
  $('editTimeDistance').value = '';
  $('editTime').value = '';
  renderEditTimes();
}
function saveEdit() {
  var date = $('editDate').value;
  if (!date) { toast('日付を入力してください', true); return; }
  var payload = {
    id: state.editLogId,
    date: date,
    distance: $('editDistance').value ? Number($('editDistance').value) : 0,
    memo: $('editMemo').value,
    times: state.editTimes.map(function (t) {
      return { event: t.event, distance: t.distance, time: t.time, pool: t.pool, format: t.format || 'TT' };
    })
  };
  showLoading(true);
  call('savePractice', [payload]).then(function () {
    showLoading(false);
    toast('更新しました');
    closeEdit();
    loadHistory();
  }).catch(function (err) {
    showLoading(false);
    toast('更新に失敗: ' + err.message, true);
  });
}

// =====================================================
// ③ 分析
// =====================================================
function destroyChart() { if (state.chart) { state.chart.destroy(); state.chart = null; } }
function showAnalysisEmpty(msg) {
  var e = $('analysisEmpty');
  e.textContent = msg;
  e.classList.remove('hidden');
}
function hideAnalysisEmpty() { $('analysisEmpty').classList.add('hidden'); }

// タイム推移 / 総距離推移 の切替
function switchAnalysisMode(mode) {
  state.analysisMode = mode;
  document.querySelectorAll('#analysisModeTabs .format-tab').forEach(function (t) {
    t.classList.toggle('active', t.dataset.mode === mode);
  });
  var isTime = (mode === 'time');
  $('anTimeFilters').classList.toggle('hidden', !isTime);
  $('chartLegend').classList.toggle('hidden', !isTime);
  $('chartHint').textContent = isTime
    ? '↑ 上にいくほど速い（タイムが小さい）'
    : '日ごとの総距離(m)の推移';
  loadAnalysis();
}

function loadAnalysis() {
  if (state.analysisMode === 'distance') {
    showLoading(true);
    call('getDistanceTrend', [state.analysisPeriod]).then(function (points) {
      showLoading(false);
      renderDistanceChart(points);
    }).catch(function (err) {
      showLoading(false);
      toast('取得に失敗: ' + err.message, true);
    });
    return;
  }
  // タイム推移
  var eventName = $('anEvent').value;
  if (!eventName) {
    destroyChart();
    showAnalysisEmpty('種目を登録・選択してください');
    return;
  }
  var lane = $('anLane').value;
  showLoading(true);
  call('getAnalysisData', [eventName, lane, state.analysisPeriod]).then(function (data) {
    showLoading(false);
    renderTimeChart(data);
  }).catch(function (err) {
    showLoading(false);
    toast('取得に失敗: ' + err.message, true);
  });
}

// 練習(TT)＝青丸、試合＝赤丸を重ねて描画
function renderTimeChart(data) {
  var practice = (data && data.practice) || [];
  var meet = (data && data.meet) || [];
  if (!practice.length && !meet.length) {
    destroyChart();
    showAnalysisEmpty('該当する記録がありません');
    return;
  }
  hideAnalysisEmpty();

  // 全ての点を日付昇順に並べ、同じラベル配列を両系列で共有（他方はnull）
  var combined = [];
  practice.forEach(function (p) { combined.push({ date: p.date, seconds: p.seconds, kind: 'practice', ref: p }); });
  meet.forEach(function (m) { combined.push({ date: m.date, seconds: m.seconds, kind: 'meet', ref: m }); });
  combined.sort(function (a, b) { return a.date.localeCompare(b.date); });

  var labels = combined.map(function (c) { return c.date; });
  var practiceData = combined.map(function (c) { return c.kind === 'practice' ? c.seconds : null; });
  var meetData = combined.map(function (c) { return c.kind === 'meet' ? c.seconds : null; });

  destroyChart();
  var ctx = $('analysisChart').getContext('2d');
  state.chart = new Chart(ctx, {
    type: 'line',
    data: {
      labels: labels,
      datasets: [
        {
          label: '練習(TT)', data: practiceData,
          borderColor: '#1789c9', backgroundColor: 'rgba(23,137,201,.12)',
          borderWidth: 2.5, pointRadius: 5, pointHoverRadius: 7,
          pointBackgroundColor: '#0f5c8c', tension: 0.2, spanGaps: true, fill: false
        },
        {
          label: '試合', data: meetData,
          borderColor: '#e74c3c', backgroundColor: '#e74c3c', showLine: false,
          pointRadius: 6, pointHoverRadius: 8, pointBackgroundColor: '#e74c3c'
        }
      ]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      scales: {
        y: {
          reverse: true, // 上に行くほどタイムが小さい＝速い
          title: { display: true, text: 'タイム(秒)　上ほど速い' },
          ticks: { callback: function (v) { return formatSeconds(v); } }
        },
        x: { ticks: { maxRotation: 60, minRotation: 0, autoSkip: true, maxTicksLimit: 8 } }
      },
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            title: function (items) { return combined[items[0].dataIndex].date; },
            label: function (item) {
              var c = combined[item.dataIndex];
              var p = c.ref;
              if (c.kind === 'meet') {
                return ['🏅 ' + (p.meetName || '試合'), '距離: ' + p.distance + 'm',
                        'タイム: ' + p.timeText, '水路: ' + (p.lane || '-')];
              }
              return ['練習(TT)', '距離: ' + p.distance + 'm', 'タイム: ' + p.timeText,
                      'プール: ' + (p.pool || '-') + (p.lane ? '（' + p.lane + '）' : '')];
            }
          }
        }
      }
    }
  });
}

// 総距離の推移（緑の折れ線、Y軸は通常向き）
function renderDistanceChart(points) {
  if (!points.length) {
    destroyChart();
    showAnalysisEmpty('該当する記録がありません');
    return;
  }
  hideAnalysisEmpty();
  var labels = points.map(function (p) { return p.date; });
  var data = points.map(function (p) { return p.distance; });

  destroyChart();
  var ctx = $('analysisChart').getContext('2d');
  state.chart = new Chart(ctx, {
    type: 'line',
    data: {
      labels: labels,
      datasets: [{
        label: '総距離(m)', data: data,
        borderColor: '#00b894', backgroundColor: 'rgba(0,184,148,.15)',
        borderWidth: 2.5, pointRadius: 5, pointHoverRadius: 7,
        pointBackgroundColor: '#009e80', tension: 0.2, fill: true
      }]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      scales: {
        y: { beginAtZero: true, title: { display: true, text: '総距離 (m)' } },
        x: { ticks: { maxRotation: 60, minRotation: 0, autoSkip: true, maxTicksLimit: 8 } }
      },
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            label: function (item) { return '総距離: ' + points[item.dataIndex].distance + 'm'; }
          }
        }
      }
    }
  });
}

// =====================================================
// 試合記録
// =====================================================
function loadMeets() {
  $('meetDate').value = $('meetDate').value || todayStr();
  showLoading(true);
  call('getMeetRecords', []).then(function (records) {
    showLoading(false);
    renderMeets(records);
  }).catch(function (err) {
    showLoading(false);
    toast('取得に失敗: ' + err.message, true);
  });
}

function renderMeets(records) {
  var box = $('meetList');
  box.innerHTML = '';
  if (!records.length) {
    box.appendChild(el('div', 'empty-hint', '試合記録がありません'));
    return;
  }
  records.forEach(function (m) {
    var card = el('div', 'history-card');
    var head = el('div', 'history-head');
    head.innerHTML = '<span class="history-date">' + esc(m.meetName || '(大会名なし)') + '</span>' +
      '<span class="history-dist">' + esc(m.date) + '</span>';
    card.appendChild(head);
    var body = el('div', 'history-memo');
    body.innerHTML = '<strong>' + esc(m.event) + ' ' + esc(m.distance) + 'm</strong>　' +
      '<span class="tm">' + esc(m.timeText) + '</span>　<span class="master-sub">' + esc(m.lane) + '</span>';
    card.appendChild(body);
    var actions = el('div', 'history-actions');
    var delBtn = el('button', 'btn danger', '削除');
    delBtn.onclick = function () { deleteMeet(m); };
    actions.appendChild(delBtn);
    card.appendChild(actions);
    box.appendChild(card);
  });
}

function saveMeet() {
  var payload = {
    meetName: $('meetName').value,
    date: $('meetDate').value,
    lane: $('meetLane').value,
    event: $('meetEvent').value,
    distance: $('meetDistance').value ? Number($('meetDistance').value) : 0,
    time: $('meetTime').value
  };
  if (!payload.date) { toast('日付を入力してください', true); return; }
  if (!payload.meetName.trim()) { toast('大会名を入力してください', true); return; }
  if (!payload.event) { toast('種目を登録・選択してください', true); return; }
  showLoading(true);
  call('saveMeetRecord', [payload]).then(function () {
    showLoading(false);
    toast('保存しました');
    $('meetName').value = '';
    $('meetDistance').value = '';
    $('meetTime').value = '';
    loadMeets();
  }).catch(function (err) {
    showLoading(false);
    toast('保存に失敗: ' + err.message, true);
  });
}

function deleteMeet(m) {
  if (!confirm(m.meetName + '（' + m.date + '）の試合記録を削除しますか？')) return;
  showLoading(true);
  call('deleteMeetRecord', [m.id]).then(function () {
    showLoading(false);
    toast('削除しました');
    loadMeets();
  }).catch(function (err) {
    showLoading(false);
    toast('削除に失敗: ' + err.message, true);
  });
}

// =====================================================
// ④ 種目マスタ
// =====================================================
function renderEventMaster() {
  var ul = $('eventList');
  ul.innerHTML = '';
  if (!state.events.length) {
    ul.appendChild(el('div', 'empty-hint', '種目がありません。追加してください。'));
    return;
  }
  state.events.forEach(function (ev) {
    var li = el('li');
    li.appendChild(el('span', 'master-name', ev.name));
    var btn = el('button', 'archive-btn', 'アーカイブ');
    btn.onclick = function () { archiveEvent(ev); };
    li.appendChild(btn);
    ul.appendChild(li);
  });
}
function addEvent() {
  var name = $('newEventName').value.trim();
  if (!name) { toast('種目名を入力してください', true); return; }
  showLoading(true);
  call('addEvent', [name]).then(function (events) {
    showLoading(false);
    state.events = events;
    $('newEventName').value = '';
    refreshAllSelects();
    renderEventMaster();
    toast('追加しました');
  }).catch(function (err) {
    showLoading(false);
    toast(err.message, true);
  });
}
function archiveEvent(ev) {
  if (!confirm('「' + ev.name + '」をアーカイブしますか？（過去のタイム記録は残ります）')) return;
  showLoading(true);
  call('archiveEvent', [ev.id]).then(function (events) {
    showLoading(false);
    state.events = events;
    refreshAllSelects();
    renderEventMaster();
    toast('アーカイブしました');
  }).catch(function (err) {
    showLoading(false);
    toast(err.message, true);
  });
}

// =====================================================
// イベント登録 & 初期化
// =====================================================
function bindEvents() {
  $('menuBtn').onclick = function () { openDrawer(!$('drawer').classList.contains('open')); };
  $('drawerOverlay').onclick = function () { openDrawer(false); };
  document.querySelectorAll('.nav-item').forEach(function (n) {
    n.onclick = function () { switchScreen(n.dataset.screen); };
  });

  // 記録入力
  document.querySelectorAll('#formatTabs .format-tab').forEach(function (tab) {
    tab.onclick = function () { switchFormat(tab.dataset.format); };
  });
  $('addTimeBtn').onclick = addPendingTime;
  $('buildGridBtn').onclick = buildTimeGrid;
  $('addGridBtn').onclick = addGridToPending;
  ['setDistance', 'setReps', 'setSets'].forEach(function (id) {
    $(id).addEventListener('input', updateSetSummary);
  });
  $('savePracticeBtn').onclick = savePractice;

  // 履歴
  $('historyFilter').onchange = loadHistory;
  $('historyDate').onchange = applyHistoryDateFilter;
  $('historyClearDate').onclick = function () { $('historyDate').value = ''; applyHistoryDateFilter(); };

  // 編集モーダル
  $('editAddTimeBtn').onclick = addEditTime;
  $('editCancelBtn').onclick = closeEdit;
  $('editSaveBtn').onclick = saveEdit;
  $('editOverlay').onclick = function (e) { if (e.target === $('editOverlay')) closeEdit(); };

  // 分析
  document.querySelectorAll('#analysisModeTabs .format-tab').forEach(function (tab) {
    tab.onclick = function () { switchAnalysisMode(tab.dataset.mode); };
  });
  $('anEvent').onchange = loadAnalysis;
  $('anLane').onchange = loadAnalysis;
  document.querySelectorAll('.period-tab').forEach(function (tab) {
    tab.onclick = function () {
      document.querySelectorAll('.period-tab').forEach(function (t) { t.classList.remove('active'); });
      tab.classList.add('active');
      state.analysisPeriod = tab.dataset.period;
      loadAnalysis();
    };
  });

  // 試合記録
  $('saveMeetBtn').onclick = saveMeet;

  // マスタ
  $('addEventBtn').onclick = addEvent;
  $('addPoolBtn').onclick = addPool;
  $('newEventName').addEventListener('keydown', function (e) { if (e.key === 'Enter') addEvent(); });
  $('newPoolName').addEventListener('keydown', function (e) { if (e.key === 'Enter') addPool(); });
}

function init() {
  $('inDate').value = todayStr();
  bindEvents();
  showLoading(true);
  call('getMasters', []).then(function (m) {
    showLoading(false);
    state.events = m.events || [];
    state.pools = m.pools || [];
    refreshAllSelects();
  }).catch(function (err) {
    showLoading(false);
    toast('初期化に失敗: ' + err.message, true);
  });
}

window.addEventListener('DOMContentLoaded', init);
</script>
