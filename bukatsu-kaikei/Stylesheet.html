<style>
  :root {
    --bg: #f4f6f9;
    --card: #ffffff;
    --primary: #2563eb;
    --warn: #d97706;
    --plus: #16a34a;
    --minus: #dc2626;
    --text: #1f2937;
    --muted: #6b7280;
    --border: #e5e7eb;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-text-size-adjust: 100%;
  }
  #app { max-width: 720px; margin: 0 auto; padding: 0 12px 48px; }

  .app-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 4px 8px;
  }
  .app-header h1 { font-size: 18px; margin: 0; }
  .month-nav { display: flex; align-items: center; gap: 8px; }
  .month-nav span { font-size: 15px; font-weight: 600; min-width: 110px; text-align: center; }
  .nav-btn {
    border: none; background: var(--card); width: 32px; height: 32px;
    border-radius: 8px; font-size: 18px; cursor: pointer; box-shadow: 0 1px 2px rgba(0,0,0,.08);
  }

  .tabs { display: flex; gap: 6px; overflow-x: auto; padding: 6px; margin-bottom: 12px;
    background: var(--card); border-radius: 14px; box-shadow: 0 1px 3px rgba(0,0,0,.06);
    position: sticky; top: 6px; z-index: 10; -webkit-overflow-scrolling: touch; }
  .tab {
    flex: 0 0 auto; border: none; background: transparent; color: var(--muted);
    padding: 9px 13px; border-radius: 10px; font-size: 13px; cursor: pointer; white-space: nowrap;
    transition: background .15s, color .15s;
  }
  .tab.active { background: var(--primary); color: #fff; font-weight: 600; box-shadow: 0 2px 6px rgba(37,99,235,.35); }

  .panel { display: none; }
  .panel.active { display: block; }

  .section-title { font-size: 14px; margin: 22px 0 8px; color: var(--muted); }

  /* ランキングカード */
  .rank-cards { display: flex; gap: 10px; }
  .rank-card { flex: 1; background: var(--card); border-radius: 14px; padding: 14px; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
  .rank-title { font-size: 13px; font-weight: 700; margin-bottom: 8px; }
  .rank-card.rich .rank-title { color: var(--plus); }
  .rank-card.debt .rank-title { color: var(--minus); }
  .rank-list { list-style: none; margin: 0; padding: 0; }
  .rank-list li { display: flex; justify-content: space-between; font-size: 13px; padding: 5px 0; border-bottom: 1px solid var(--border); }
  .rank-list li:last-child { border-bottom: none; }
  .rank-list .amt { font-weight: 700; }

  /* テーブル */
  .data-table { width: 100%; border-collapse: collapse; background: var(--card); border-radius: 12px; overflow: hidden; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
  .data-table th, .data-table td { padding: 11px 10px; font-size: 13px; text-align: left; border-bottom: 1px solid var(--border); }
  .data-table th { background: #f3f6fa; color: var(--muted); font-weight: 600; font-size: 12px; }
  .data-table tbody tr:nth-child(even) td { background: #fafbfd; }
  .data-table th.num, .data-table td.num { text-align: right; }
  .data-table tr:last-child td { border-bottom: none; }
  .del-btn { background: none; border: none; color: var(--minus); cursor: pointer; font-size: 13px; }
  .plus  { color: var(--plus); }
  .minus { color: var(--minus); }
  .clickable { cursor: pointer; }
  .clickable:hover { background: #f9fafb; }

  .month-sum { margin: 12px 0; font-weight: 700; text-align: right; }
  .hint { font-size: 12px; color: var(--muted); margin: 4px 0 12px; }
  .sub { font-size: 11px; color: var(--muted); }

  /* PDF発行バー */
  .pdf-bar { display: flex; justify-content: flex-end; margin-bottom: 12px; }

  /* イベント */
  .event-head { display: flex; align-items: center; justify-content: space-between; margin: 6px 0; }
  .event-list { display: flex; flex-direction: column; gap: 8px; }
  .event-card {
    background: var(--card); border-radius: 12px; padding: 12px 14px; box-shadow: 0 1px 3px rgba(0,0,0,.06);
    display: flex; align-items: center; gap: 10px; cursor: pointer;
  }
  .event-card .ev-main { flex: 1; }
  .event-card .ev-name { font-weight: 700; font-size: 14px; }
  .event-card .ev-meta { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .badge { font-size: 11px; padding: 2px 8px; border-radius: 999px; font-weight: 700; }
  .badge.done { background: #fef3c7; color: var(--warn); }
  .badge.todo { background: #e0e7ff; color: var(--primary); }

  /* 外部参加 */
  .ext-add { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
  .ext-add input, .ext-add select { flex: 1; min-width: 120px; }
  .pill-btn { border: none; border-radius: 999px; padding: 3px 10px; font-size: 12px; cursor: pointer; font-weight: 700; }
  .pill-btn.todo { background: #e0e7ff; color: var(--primary); }
  .pill-btn.done { background: #fef3c7; color: var(--warn); }

  /* 練習日 */
  .practice-head { margin-bottom: 12px; }
  .practice-head input { width: 100%; }
  .practice-pool { background: var(--card); border-radius: 14px; padding: 14px; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
  .practice-pool > label { font-size: 12px; color: var(--muted); }
  .pool-row { display: flex; gap: 8px; margin-top: 6px; }
  .pool-row select { flex: 1; }
  .status-line { font-size: 13px; margin-top: 8px; color: var(--muted); }
  .status-line.settled { color: var(--warn); font-weight: 700; }

  .attend-head { display: flex; align-items: center; justify-content: space-between; margin: 20px 0 8px; }
  .attend-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
  .attend-item {
    background: var(--card); border: 2px solid var(--border); border-radius: 12px;
    padding: 12px; font-size: 14px; cursor: pointer; display: flex;
    align-items: center; justify-content: space-between; user-select: none;
    box-shadow: 0 1px 2px rgba(0,0,0,.04); transition: border-color .12s, background .12s;
  }
  .attend-item .sub { font-size: 11px; color: var(--muted); }
  .attend-item.present { border-color: var(--primary); background: #eff6ff; }
  .attend-item.present .check { color: var(--primary); font-weight: 700; }
  .attend-item .check { color: transparent; }
  .attend-item.mane .sub { color: var(--warn); }
  .attend-item.mane.present { border-color: var(--warn); background: #fffbeb; }
  .attend-item.mane.present .check { color: var(--warn); }

  .practice-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
  .practice-actions button { flex: 1; min-width: 120px; }

  /* チャージ */
  .charge-add { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
  .charge-add select, .charge-add input { flex: 1; min-width: 120px; }

  /* フォーム共通 */
  input, select {
    padding: 9px 10px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px;
    background: #fff; color: var(--text);
  }
  .form-grid { display: grid; grid-template-columns: 90px 1fr; gap: 10px; align-items: center; }
  .form-grid input, .form-grid select { width: 100%; }
  .check-label { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text); }
  .check-label input { width: auto; }
  textarea { width: 100%; padding: 9px 10px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; font-family: inherit; box-sizing: border-box; resize: vertical; }
  .fld-label { display: block; font-size: 12px; color: var(--muted); margin: 10px 0 4px; }
  button.primary { background: var(--primary); color: #fff; border: none; padding: 10px 16px; border-radius: 8px; cursor: pointer; font-size: 14px; }
  button.warn { background: var(--warn); color: #fff; border: none; padding: 10px 16px; border-radius: 8px; cursor: pointer; font-size: 14px; }
  button.ghost { background: #fff; color: var(--text); border: 1px solid var(--border); padding: 10px 16px; border-radius: 8px; cursor: pointer; font-size: 14px; }
  button.sm { padding: 7px 12px; font-size: 13px; }

  /* モーダル */
  .modal-overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,.4);
    align-items: center; justify-content: center; padding: 16px; z-index: 50;
  }
  .modal-overlay.show { display: flex; }
  .modal { background: #fff; border-radius: 16px; padding: 18px; width: 100%; max-width: 420px; }
  .modal h3 { margin: 0 0 14px; }
  .modal-footer { display: flex; align-items: center; gap: 8px; margin-top: 18px; }
  .modal-footer .grow { flex: 1; }
  .modal-footer button:not(.primary):not(.del-btn) { background: #e5e7eb; border: none; padding: 9px 16px; border-radius: 8px; cursor: pointer; }

  .loading { display: none; position: fixed; top: 12px; left: 50%; transform: translateX(-50%);
    background: #111; color: #fff; padding: 8px 16px; border-radius: 999px; font-size: 13px; z-index: 100; }
  .loading.show { display: block; }

  /* サマリーカード（残高タブ上部） */
  .stat-cards { display: flex; gap: 10px; margin-bottom: 12px; }
  .stat { flex: 1; background: var(--card); border-radius: 14px; padding: 12px 14px; box-shadow: 0 1px 3px rgba(0,0,0,.06); text-align: center; }
  .stat-label { font-size: 11px; color: var(--muted); }
  .stat-value { font-size: 18px; font-weight: 700; margin-top: 3px; }

  /* セグメント切替（イベントの精算方式） */
  .seg { display: flex; gap: 4px; background: #eef1f5; border-radius: 10px; padding: 4px; }
  .seg-btn { flex: 1; border: none; background: transparent; color: var(--muted);
    padding: 9px 8px; border-radius: 8px; font-size: 13px; cursor: pointer; transition: background .12s, color .12s; }
  .seg-btn.active { background: #fff; color: var(--primary); font-weight: 700; box-shadow: 0 1px 3px rgba(0,0,0,.12); }

  /* 個別金額リスト */
  .bulk-row { display: flex; gap: 8px; margin-top: 8px; }
  .bulk-row input { flex: 1; }
  .amount-list { display: flex; flex-direction: column; gap: 6px; max-height: 240px; overflow-y: auto; }
  .amount-item { display: flex; align-items: center; gap: 10px; background: var(--card);
    border: 1px solid var(--border); border-radius: 10px; padding: 8px 10px; }
  .amount-item .amt-name { flex: 1; font-size: 14px; }
  .amount-item .amt-input { width: 110px; text-align: right; }
</style>
