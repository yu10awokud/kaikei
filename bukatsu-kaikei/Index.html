<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <?!= include('Stylesheet'); ?>
</head>
<body>
  <div id="app">
    <header class="app-header">
      <h1>部活会計</h1>
      <div class="month-nav">
        <button id="prevMonth" class="nav-btn">‹</button>
        <span id="currentMonthLabel">----年--月</span>
        <button id="nextMonth" class="nav-btn">›</button>
      </div>
    </header>

    <!-- タブ -->
    <nav class="tabs">
      <button class="tab active" data-tab="dashboard">残高</button>
      <button class="tab" data-tab="practice">練習日</button>
      <button class="tab" data-tab="charge">チャージ</button>
      <button class="tab" data-tab="attend">出席ランキング</button>
      <button class="tab" data-tab="master">マスタ</button>
    </nav>

    <!-- ===== 残高（ダッシュボード） ===== -->
    <section id="dashboard" class="panel active">
      <div class="rank-cards">
        <div class="rank-card rich">
          <div class="rank-title">💰 富豪ランキング</div>
          <ol id="richList" class="rank-list"></ol>
        </div>
        <div class="rank-card debt">
          <div class="rank-title">🔻 借金ランキング</div>
          <ol id="debtList" class="rank-list"></ol>
        </div>
      </div>

      <h3 class="section-title">全員の残高</h3>
      <table class="data-table">
        <thead>
          <tr><th>氏名</th><th class="num">チャージ</th><th class="num">支払</th><th class="num">残高</th></tr>
        </thead>
        <tbody id="balanceTableBody"></tbody>
      </table>
    </section>

    <!-- ===== 練習日（①日程 ②出席 ③精算） ===== -->
    <section id="practice" class="panel">
      <div class="practice-head">
        <input type="date" id="practiceDate">
      </div>

      <div class="practice-pool">
        <label>使用プール</label>
        <div class="pool-row">
          <select id="practicePool"></select>
          <button id="savePoolBtn" class="primary sm">設定</button>
        </div>
        <div id="practiceStatus" class="status-line"></div>
      </div>

      <div class="attend-head">
        <h3 class="section-title" style="margin:0;">出席（タップで切替）</h3>
        <button id="allPresentBtn" class="ghost sm">全員出席</button>
      </div>
      <div id="attendList" class="attend-list"></div>

      <div class="practice-actions">
        <button id="saveAttendBtn" class="primary">出席を保存</button>
        <button id="settleBtn" class="warn">この日を精算する</button>
        <button id="unsettleBtn" class="ghost" style="display:none;">精算を取り消す</button>
      </div>
    </section>

    <!-- ===== チャージ（④） ===== -->
    <section id="charge" class="panel">
      <div class="charge-add">
        <select id="chargeMember"></select>
        <input type="number" id="chargeAmount" placeholder="金額（円）">
        <input type="date" id="chargeDate">
        <input type="text" id="chargeMemo" placeholder="メモ（任意）">
        <button id="chargeAddBtn" class="primary">チャージ追加</button>
      </div>
      <div class="month-sum" id="chargeMonthSum">今月のチャージ合計: ¥0</div>
      <table class="data-table">
        <thead>
          <tr><th>日付</th><th>部員</th><th class="num">金額</th><th>メモ</th><th></th></tr>
        </thead>
        <tbody id="chargeTableBody"></tbody>
      </table>
    </section>

    <!-- ===== 出席ランキング（⑥） ===== -->
    <section id="attend" class="panel">
      <div class="month-sum" id="attendTotalDays">今月の練習日数: 0日</div>
      <table class="data-table">
        <thead>
          <tr><th>順位</th><th>氏名</th><th class="num">出席回数</th></tr>
        </thead>
        <tbody id="attendRankBody"></tbody>
      </table>
    </section>

    <!-- ===== マスタ（部員・プール） ===== -->
    <section id="master" class="panel">
      <h3 class="section-title">部員マスタ</h3>
      <table class="data-table">
        <thead>
          <tr><th>氏名</th><th>学年</th><th>学科</th><th>区分</th><th>状態</th><th></th></tr>
        </thead>
        <tbody id="memberTableBody"></tbody>
      </table>
      <button id="addMemberBtn" class="primary sm" style="margin-top:10px;">＋ 部員を追加</button>

      <h3 class="section-title" style="margin-top:26px;">プール代マスタ</h3>
      <table class="data-table">
        <thead>
          <tr><th>プール名</th><th class="num">1人あたり料金</th><th></th></tr>
        </thead>
        <tbody id="poolTableBody"></tbody>
      </table>
      <button id="addPoolBtn" class="primary sm" style="margin-top:10px;">＋ プールを追加</button>
    </section>
  </div>

  <!-- 部員編集モーダル -->
  <div id="memberModal" class="modal-overlay">
    <div class="modal">
      <h3 id="memberModalTitle">部員</h3>
      <div class="form-grid">
        <label>氏名</label><input type="text" id="mName">
        <label>学年</label><input type="text" id="mGrade" placeholder="例: 2年">
        <label>学科</label><input type="text" id="mDept">
        <label>区分</label>
        <select id="mRole"><option value="プレ">プレ（選手）</option><option value="マネ">マネ（マネージャー）</option></select>
        <label>状態</label>
        <select id="mStatus"><option value="現役">現役</option><option value="引退">引退</option></select>
      </div>
      <div class="modal-footer">
        <button id="mDeleteBtn" class="del-btn">削除</button>
        <span class="grow"></span>
        <button id="mCancelBtn">キャンセル</button>
        <button id="mSaveBtn" class="primary">保存</button>
      </div>
    </div>
  </div>

  <!-- プール編集モーダル -->
  <div id="poolModal" class="modal-overlay">
    <div class="modal">
      <h3 id="poolModalTitle">プール</h3>
      <div class="form-grid">
        <label>プール名</label><input type="text" id="pName">
        <label>料金(円)</label><input type="number" id="pPrice">
        <label>マネも徴収</label>
        <label class="check-label"><input type="checkbox" id="pChargeMane"> このプールはマネさんからも徴収する</label>
      </div>
      <div class="modal-footer">
        <button id="pDeleteBtn" class="del-btn">削除</button>
        <span class="grow"></span>
        <button id="pCancelBtn">キャンセル</button>
        <button id="pSaveBtn" class="primary">保存</button>
      </div>
    </div>
  </div>

  <div id="loading" class="loading">処理中...</div>

  <?!= include('JavaScript'); ?>
</body>
</html>
