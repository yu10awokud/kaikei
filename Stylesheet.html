<style>
  :root {
    --bg: #f4f6f9;
    --card: #ffffff;
    --primary: #2563eb;
    --a: #2563eb;   /* 生徒A */
    --b: #16a34a;   /* 生徒B */
    --plus: #16a34a;
    --minus: #dc2626;
    --text: #1f2937;
    --muted: #6b7280;
    --border: #e5e7eb;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-text-size-adjust: 100%;
  }
  #app { max-width: 720px; margin: 0 auto; padding: 0 12px 40px; }

  .app-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 4px 8px;
  }
  .app-header h1 { font-size: 18px; margin: 0; }
  .month-nav { display: flex; align-items: center; gap: 8px; }
  .month-nav span { font-size: 15px; font-weight: 600; min-width: 110px; text-align: center; }
  .nav-btn {
    border: none; background: var(--card); width: 32px; height: 32px;
    border-radius: 8px; font-size: 18px; cursor: pointer; box-shadow: 0 1px 2px rgba(0,0,0,.08);
  }

  .tabs { display: flex; gap: 6px; overflow-x: auto; padding: 4px 0 12px; }
  .tab {
    flex: 0 0 auto; border: none; background: transparent; color: var(--muted);
    padding: 8px 12px; border-radius: 999px; font-size: 13px; cursor: pointer; white-space: nowrap;
  }
  .tab.active { background: var(--primary); color: #fff; font-weight: 600; }

  .panel { display: none; }
  .panel.active { display: block; }

  /* ダッシュボード */
  .cards { display: flex; gap: 10px; }
  .card {
    flex: 1; background: var(--card); border-radius: 14px; padding: 16px;
    box-shadow: 0 1px 3px rgba(0,0,0,.06);
  }
  .card.big { flex: 1.4; }
  .card-label { font-size: 12px; color: var(--muted); }
  .card-value { font-size: 26px; font-weight: 700; margin-top: 4px; }
  .card.big .card-value { font-size: 30px; }
  .card-diff { font-size: 13px; margin-top: 6px; font-weight: 600; }

  .section-title { font-size: 14px; margin: 22px 0 8px; color: var(--muted); }
  .breakdown { background: var(--card); border-radius: 14px; padding: 4px 16px; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
  .bd-row { display: grid; grid-template-columns: 1fr auto auto; gap: 12px; align-items: center;
            padding: 12px 0; border-bottom: 1px solid var(--border); }
  .bd-row:last-child { border-bottom: none; }
  .bd-row span:nth-child(2) { font-weight: 700; }
  .bd-diff { font-size: 12px; font-weight: 600; min-width: 70px; text-align: right; }
  .bd-row.sub span { font-size: 12px; color: var(--muted); font-weight: 400; }

  .plus  { color: var(--plus); }
  .minus { color: var(--minus); }

  /* カレンダー */
  .legend { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); margin: 4px 0 10px; }
  .legend .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  .legend > span:not(.dot) { margin-right: 12px; }
  .dot.a { background: var(--a); }
  .dot.b { background: var(--b); }

  .weekdays, .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); }
  .weekdays span { text-align: center; font-size: 12px; color: var(--muted); padding: 4px 0; }
  .calendar-grid { gap: 4px; }
  .day {
    background: var(--card); border-radius: 8px; min-height: 58px; padding: 4px;
    font-size: 12px; cursor: pointer; position: relative; border: 1px solid transparent;
  }
  .day.empty { background: transparent; cursor: default; }
  .day.today { border-color: var(--primary); }
  .day .num { font-weight: 600; }
  .day .pill { display: block; font-size: 10px; border-radius: 4px; padding: 1px 3px; margin-top: 2px; color: #fff; }
  .pill.a { background: var(--a); }
  .pill.b { background: var(--b); }

  .month-sum { margin-top: 14px; font-weight: 700; text-align: right; }

  /* スイング */
  .swing-add { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  .swing-add input { flex: 1; min-width: 120px; }

  /* テーブル */
  .data-table { width: 100%; border-collapse: collapse; background: var(--card); border-radius: 12px; overflow: hidden; }
  .data-table th, .data-table td { padding: 10px; font-size: 13px; text-align: left; border-bottom: 1px solid var(--border); }
  .data-table th { background: #f9fafb; color: var(--muted); font-weight: 600; }
  .del-btn { background: none; border: none; color: var(--minus); cursor: pointer; font-size: 13px; }

  /* フォーム共通 */
  input, select {
    padding: 9px 10px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px;
    background: #fff; color: var(--text);
  }
  .form-grid { display: grid; grid-template-columns: 120px 1fr; gap: 10px; align-items: center; }
  .form-grid input { width: 100%; }
  button.primary { background: var(--primary); color: #fff; border: none; padding: 9px 16px; border-radius: 8px; cursor: pointer; font-size: 14px; }
  #saveSettingsBtn { margin-top: 16px; }

  /* モーダル */
  .modal-overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,.4);
    align-items: center; justify-content: center; padding: 16px; z-index: 50;
  }
  .modal-overlay.show { display: flex; }
  .modal { background: #fff; border-radius: 16px; padding: 18px; width: 100%; max-width: 420px; }
  .modal h3 { margin: 0 0 12px; }
  .modal-record { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
  .modal-record .tag { padding: 2px 8px; border-radius: 6px; color: #fff; font-size: 12px; }
  .modal-record .grow { flex: 1; }
  .modal-add { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .modal-add input, .modal-add select { flex: 1; min-width: 80px; }
  .modal-footer { margin-top: 14px; text-align: right; }
  .modal-footer button { background: #e5e7eb; border: none; padding: 9px 16px; border-radius: 8px; cursor: pointer; }

  .loading { display: none; position: fixed; top: 12px; left: 50%; transform: translateX(-50%);
    background: #111; color: #fff; padding: 8px 16px; border-radius: 999px; font-size: 13px; z-index: 100; }
  .loading.show { display: block; }
</style>
