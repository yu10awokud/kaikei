<style>
  :root {
    --blue-900: #0a2a43;
    --blue-700: #0f5c8c;
    --blue-500: #1789c9;
    --blue-300: #5bc0e8;
    --blue-050: #e8f4fb;
    --accent:   #00b894;
    --danger:   #e74c3c;
    --bg:       #f2f7fb;
    --card:     #ffffff;
    --text:     #1c2b36;
    --muted:    #6c7a86;
    --border:   #d9e3ea;
    --radius:   14px;
    --shadow:   0 2px 10px rgba(15, 92, 140, 0.10);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans",
                 "Yu Gothic", Meiryo, sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 16px;
    -webkit-text-size-adjust: 100%;
  }

  #app { max-width: 640px; margin: 0 auto; min-height: 100vh; }

  /* ===== ヘッダー ===== */
  .app-header {
    position: sticky; top: 0; z-index: 30;
    display: flex; align-items: center; gap: 10px;
    background: linear-gradient(135deg, var(--blue-700), var(--blue-500));
    color: #fff; padding: 12px 16px;
    box-shadow: var(--shadow);
  }
  .app-header h1 { font-size: 18px; margin: 0; flex: 1; font-weight: 600; }
  .header-logo { font-size: 22px; }
  .menu-btn {
    background: rgba(255,255,255,0.18); border: none; color: #fff;
    font-size: 20px; width: 40px; height: 40px; border-radius: 10px;
    cursor: pointer;
  }

  /* ===== ドロワー ===== */
  .drawer {
    position: fixed; top: 0; left: 0; bottom: 0; width: 250px;
    background: var(--blue-900); color: #fff; z-index: 50;
    transform: translateX(-100%); transition: transform .25s ease;
    padding-top: 60px; display: flex; flex-direction: column;
  }
  .drawer.open { transform: translateX(0); }
  .nav-item {
    background: none; border: none; color: #cfe4f2; text-align: left;
    padding: 16px 22px; font-size: 16px; cursor: pointer;
    border-left: 4px solid transparent;
  }
  .nav-item.active { background: rgba(255,255,255,0.08); color: #fff; border-left-color: var(--blue-300); }
  .drawer-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 40;
    opacity: 0; pointer-events: none; transition: opacity .25s;
  }
  .drawer-overlay.show { opacity: 1; pointer-events: auto; }

  /* ===== コンテンツ ===== */
  .content { padding: 16px; }
  .screen { display: none; animation: fade .2s ease; }
  .screen.active { display: block; }
  @keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

  .section-title {
    font-size: 15px; color: var(--blue-700); margin: 20px 0 10px;
    font-weight: 700;
  }
  .field-label { display: block; font-size: 13px; color: var(--muted); margin: 12px 0 4px; }

  /* ===== フォーム部品 ===== */
  .input {
    width: 100%; padding: 12px 12px; font-size: 16px;
    border: 1.5px solid var(--border); border-radius: 10px;
    background: #fff; color: var(--text); outline: none;
  }
  .input:focus { border-color: var(--blue-500); box-shadow: 0 0 0 3px rgba(23,137,201,.15); }
  textarea.input { resize: vertical; }
  select.input { appearance: none; background-image:
    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8'><path d='M1 1l5 5 5-5' stroke='%236c7a86' stroke-width='2' fill='none'/></svg>");
    background-repeat: no-repeat; background-position: right 14px center; padding-right: 34px; }

  .form-block {
    background: var(--card); border-radius: var(--radius);
    padding: 12px 16px 18px; box-shadow: var(--shadow); margin-bottom: 14px;
  }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
  .row-inline { display: flex; gap: 10px; align-items: stretch; }
  .row-inline .input { flex: 1; }
  .row-inline .btn { white-space: nowrap; }

  /* ===== ボタン ===== */
  .btn {
    border: none; border-radius: 10px; padding: 12px 18px;
    font-size: 15px; font-weight: 600; cursor: pointer;
    background: #eef3f7; color: var(--text);
  }
  .btn.primary { background: var(--blue-500); color: #fff; }
  .btn.secondary { background: var(--blue-050); color: var(--blue-700); border: 1.5px solid var(--blue-300); }
  .btn.block { width: 100%; }
  .btn.big { padding: 16px; font-size: 17px; margin-top: 6px; }
  .btn.danger { background: var(--danger); color: #fff; }
  .btn:active { transform: scale(.98); }

  /* ===== 形式タブ ===== */
  .format-tabs { display: flex; gap: 6px; margin-bottom: 4px; }
  .format-tab {
    flex: 1; background: var(--card); border: 1.5px solid var(--border);
    color: var(--muted); border-radius: 8px; padding: 10px 0; font-size: 14px;
    cursor: pointer; font-weight: 600;
  }
  .format-tab.active { background: var(--blue-500); color: #fff; border-color: var(--blue-500); }
  .format-hint { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .set-summary { font-size: 14px; color: var(--blue-700); font-weight: 700; margin: 10px 0 8px; min-height: 1em; }

  /* ===== 一括入力グリッド ===== */
  .time-grid { margin: 10px 0; }
  .grid-set { margin-bottom: 12px; }
  .grid-set-title { font-size: 13px; color: var(--muted); font-weight: 700; margin-bottom: 6px; }
  .grid-rows { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .grid-rows-col { display: flex; flex-direction: column; gap: 12px; }
  .grid-rep { border: 1px solid var(--border); border-radius: 10px; padding: 8px 10px; }
  .grid-rep .rep-label { display: block; font-size: 12px; color: var(--muted); font-weight: 700; margin-bottom: 6px; }
  .grid-cell { display: flex; align-items: center; gap: 6px; }
  .grid-cell .rep-label { font-size: 12px; color: var(--muted); white-space: nowrap; width: 34px; }
  .grid-cell .input { padding: 10px; }

  /* ===== 形式バッジ ===== */
  .type-badge {
    display: inline-block; font-size: 11px; font-weight: 700; padding: 1px 7px;
    border-radius: 10px; margin-left: 6px; vertical-align: middle;
  }
  .type-badge.TT { background: #dff5ee; color: var(--accent); }
  .type-badge.Short { background: #fdeede; color: #d98a1f; }
  .type-badge.Middle { background: #e7e9fb; color: #5b60c9; }

  /* ===== 追加待ちリスト ===== */
  .pending-list { list-style: none; padding: 0; margin: 10px 0; }
  .pending-list li {
    display: flex; align-items: center; justify-content: space-between;
    background: var(--card); border: 1px solid var(--border);
    border-radius: 10px; padding: 10px 12px; margin-bottom: 8px;
  }
  .pending-info { font-size: 14px; }
  .pending-info .ev { font-weight: 700; color: var(--blue-700); }
  .pending-info .tm { font-weight: 700; }
  .pending-info .sub { color: var(--muted); font-size: 12px; }
  .icon-btn {
    background: none; border: none; color: var(--danger);
    font-size: 20px; cursor: pointer; padding: 4px 8px;
  }

  /* ===== 履歴 ===== */
  .filter-bar { margin-bottom: 12px; }
  .history-list { display: flex; flex-direction: column; gap: 12px; }
  .history-card {
    background: var(--card); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 14px 16px;
  }
  .history-head { display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 6px; }
  .history-date { font-size: 17px; font-weight: 700; color: var(--blue-700); }
  .history-dist { font-size: 14px; color: var(--muted); }
  .history-memo { font-size: 14px; margin: 8px 0; white-space: pre-wrap; color: #3a4a56; }
  .time-table { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 14px; }
  .time-table th, .time-table td { padding: 6px 4px; text-align: left; border-bottom: 1px solid var(--border); }
  .time-table th { color: var(--muted); font-weight: 600; font-size: 12px; }
  .time-table td .del-tm { color: var(--danger); background: none; border: none; cursor: pointer; font-size: 16px; }
  .history-actions { display: flex; gap: 10px; margin-top: 12px; }
  .history-actions .btn { flex: 1; padding: 10px; font-size: 14px; }

  /* ===== マスタ一覧 ===== */
  .master-list { list-style: none; padding: 0; margin: 0; }
  .master-list li {
    display: flex; align-items: center; justify-content: space-between;
    background: var(--card); border-radius: 10px; box-shadow: var(--shadow);
    padding: 12px 14px; margin-bottom: 8px;
  }
  .master-name { font-weight: 600; }
  .master-sub { font-size: 12px; color: var(--muted); margin-left: 8px; }
  .archive-btn {
    background: #fbeaea; color: var(--danger); border: none;
    border-radius: 8px; padding: 8px 12px; font-size: 13px; cursor: pointer;
  }

  /* ===== 分析 ===== */
  .period-tabs { display: flex; gap: 6px; margin: 14px 0 6px; }
  .period-tab {
    flex: 1; background: var(--card); border: 1.5px solid var(--border);
    color: var(--muted); border-radius: 8px; padding: 10px 0; font-size: 14px;
    cursor: pointer; font-weight: 600;
  }
  .period-tab.active { background: var(--blue-500); color: #fff; border-color: var(--blue-500); }
  .chart-hint { font-size: 12px; color: var(--accent); text-align: right; margin-bottom: 4px; font-weight: 600; }
  .chart-legend { display: flex; gap: 16px; justify-content: center; margin-bottom: 8px; font-size: 13px; color: var(--muted); }
  .lg-item { display: inline-flex; align-items: center; gap: 6px; }
  .lg-dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
  .lg-dot.blue { background: #0f5c8c; }
  .lg-dot.red { background: #e74c3c; }
  .chart-wrap {
    background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow);
    padding: 12px; position: relative; height: 340px;
  }
  .empty-msg { text-align: center; color: var(--muted); padding: 40px 0; }
  .hidden { display: none; }

  /* ===== ベスト表 ===== */
  .best-block { margin-bottom: 26px; }
  .best-block .best-caption {
    font-size: 15px; font-weight: 700; color: var(--blue-700);
    margin: 18px 0 10px; display: flex; align-items: center; gap: 8px;
  }
  .best-block .best-caption::before {
    content: ''; width: 5px; height: 18px; border-radius: 3px; background: var(--blue-500);
  }
  .best-scroll {
    overflow-x: auto; -webkit-overflow-scrolling: touch;
    border-radius: 12px; box-shadow: var(--shadow); background: var(--card);
  }
  .best-table {
    border-collapse: collapse; width: 100%; table-layout: fixed;
    min-width: 340px; font-size: 13px;
  }
  .best-table th, .best-table td {
    border: 1px solid var(--border); text-align: center; padding: 0;
  }
  .best-table thead th {
    background: var(--blue-500); color: #fff; font-weight: 700;
    font-size: 12px; padding: 9px 2px;
  }
  .best-table .corner { background: var(--blue-700); font-size: 11px; width: 22%; }
  .best-table .row-head {
    background: var(--blue-050); color: var(--blue-700); font-weight: 700;
    padding: 10px 2px; width: 22%;
  }
  .best-table td.na {
    background: repeating-linear-gradient(45deg, #f4f6f8, #f4f6f8 6px, #eaeef1 6px, #eaeef1 12px);
  }
  .best-table td.empty { color: #cbd3d9; padding: 12px 2px; }
  /* タップできるベストタイムのセル */
  .best-cell {
    display: block; width: 100%; border: none; background: none;
    padding: 12px 4px; font-family: inherit; font-size: 14px; font-weight: 700;
    color: var(--blue-700); cursor: pointer; position: relative;
  }
  .best-cell::after {
    content: ''; position: absolute; left: 50%; bottom: 6px; transform: translateX(-50%);
    width: 18px; height: 2px; border-radius: 2px; background: var(--blue-300);
  }
  .best-cell:active { background: var(--blue-050); }

  /* ベスト詳細モーダル */
  .best-detail dt { font-size: 12px; color: var(--muted); margin-top: 10px; }
  .best-detail dd { margin: 2px 0 0; font-size: 16px; font-weight: 600; }
  .best-detail .bd-time { font-size: 30px; color: var(--blue-700); font-weight: 800; }

  /* ===== ラップ入力 ===== */
  .lap-hint { font-size: 11px; color: var(--accent); font-weight: 600; margin-left: 6px; }
  .time-entry { margin-bottom: 4px; }
  .lap-toggle {
    display: block; width: 100%; margin-top: 8px; padding: 9px 12px;
    background: var(--blue-050); color: var(--blue-700);
    border: 1.5px dashed var(--blue-300); border-radius: 10px;
    font-size: 13px; font-weight: 700; font-family: inherit; cursor: pointer;
  }
  .lap-toggle.active { border-style: solid; background: #d6ecfa; }
  .lap-wrap { margin-top: 10px; }
  .lap-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .lap-cell { display: flex; align-items: center; gap: 6px; }
  .lap-cell .lap-num { font-size: 12px; color: var(--muted); white-space: nowrap; width: 42px; text-align: right; }
  .lap-cell .input { padding: 10px; }
  .split-view {
    font-size: 12px; color: var(--blue-700); margin-top: 8px; line-height: 1.6;
    background: var(--blue-050); border-radius: 8px; padding: 8px 10px; display: none;
  }
  .split-view.show { display: block; }

  /* ===== カレンダー ウィジェット ===== */
  .cal-widgets { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 12px; -webkit-overflow-scrolling: touch; }
  .widget {
    flex: 0 0 auto; min-width: 130px; border-radius: 14px; padding: 12px 14px;
    color: #fff; box-shadow: var(--shadow); position: relative;
  }
  .widget.distance { background: linear-gradient(135deg, var(--blue-700), var(--blue-500)); }
  .widget.race { background: linear-gradient(135deg, #ff8a3d, #ff5e62); }
  .widget.add {
    background: var(--card); color: var(--blue-500); border: 2px dashed var(--blue-300);
    display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: 700;
    min-width: 56px; cursor: pointer;
  }
  .widget-label { font-size: 11px; opacity: .92; }
  .widget-value { font-size: 22px; font-weight: 800; margin-top: 4px; line-height: 1.1; }
  .widget-value small { font-size: 12px; font-weight: 600; }
  .widget-sub { font-size: 11px; opacity: .9; margin-top: 2px; }
  .widget .wdel {
    position: absolute; top: 4px; right: 6px; background: rgba(255,255,255,.25);
    border: none; color: #fff; width: 20px; height: 20px; border-radius: 50%;
    font-size: 12px; line-height: 1; cursor: pointer;
  }

  /* ===== カレンダー本体 ===== */
  .cal-nav { display: flex; align-items: center; justify-content: center; gap: 18px; margin-bottom: 8px; }
  .cal-nav-btn {
    background: var(--blue-050); color: var(--blue-700); border: none; width: 40px; height: 40px;
    border-radius: 10px; font-size: 22px; cursor: pointer;
  }
  .cal-month-label { font-size: 17px; font-weight: 700; color: var(--blue-700); min-width: 130px; text-align: center; }
  .cal-weekdays { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .cal-weekdays .sun { color: #e05a5a; }
  .cal-weekdays .sat { color: #3d7fe0; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .cal-day {
    position: relative; aspect-ratio: 1 / 1; border-radius: 10px; background: var(--card);
    border: 1.5px solid transparent; display: flex; flex-direction: column; align-items: center;
    justify-content: flex-start; padding-top: 6px; cursor: pointer; box-shadow: 0 1px 3px rgba(15,92,140,.06);
  }
  .cal-day.empty { background: transparent; box-shadow: none; cursor: default; }
  .cal-day .dnum { font-size: 13px; color: var(--text); }
  .cal-day.sun .dnum { color: #e05a5a; }
  .cal-day.sat .dnum { color: #3d7fe0; }
  .cal-day.today { border-color: var(--blue-300); }
  .cal-day.has-practice { background: var(--blue-050); }
  .cal-day.selected { border-color: var(--blue-500); background: #d6ecfa; }
  .cal-day .dmark {
    margin-top: 2px; width: 6px; height: 6px; border-radius: 50%; background: var(--blue-500);
  }
  .cal-day .ddist { font-size: 9px; color: var(--blue-700); margin-top: 1px; font-weight: 700; }
  .cal-day .dpool {
    font-size: 8px; color: var(--muted); margin-top: 1px; max-width: 96%;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 0 2px;
  }

  /* ===== 選択日の詳細 ===== */
  .day-detail { margin-top: 16px; }
  .day-detail-head { font-size: 15px; font-weight: 700; color: var(--blue-700); margin-bottom: 10px; }
  .rec-row {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    background: #fff; border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 12px; margin-bottom: 8px; cursor: pointer;
  }
  .rec-row .rec-main { font-size: 14px; }
  .rec-row .rec-main .ev { font-weight: 700; color: var(--blue-700); }
  .rec-row .rec-main .tm { font-weight: 700; }
  .rec-row .rec-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .rec-row .chev { color: var(--blue-300); font-size: 18px; }
  .rec-lap-flag { font-size: 10px; color: var(--accent); font-weight: 700; margin-left: 4px; }

  /* ===== ラップ詳細テーブル ===== */
  .lap-table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 6px; }
  .lap-table th, .lap-table td { border: 1px solid var(--border); padding: 7px 6px; text-align: center; }
  .lap-table thead th { background: var(--blue-050); color: var(--blue-700); font-size: 12px; }
  .rd-summary { font-size: 14px; margin-bottom: 10px; }
  .rd-summary .big { font-size: 26px; font-weight: 800; color: var(--blue-700); display: block; margin-top: 2px; }

  /* ===== モーダル ===== */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(10,42,67,.55);
    display: none; align-items: center; justify-content: center; z-index: 60; padding: 16px;
  }
  .modal-overlay.show { display: flex; }
  .modal {
    background: #fff; border-radius: var(--radius); width: 100%; max-width: 480px;
    max-height: 90vh; overflow-y: auto; padding: 18px 18px 20px;
  }
  .modal h3 { margin: 0 0 8px; color: var(--blue-700); }
  .modal-footer { display: flex; gap: 10px; margin-top: 16px; }
  .modal-footer .btn { flex: 1; }
  .edit-add { border-top: 1px dashed var(--border); padding-top: 12px; margin-top: 6px; }
  .edit-add .row2 { margin-bottom: 8px; }

  /* ===== ローディング / トースト ===== */
  .loading {
    position: fixed; inset: 0; background: rgba(255,255,255,.6);
    display: none; align-items: center; justify-content: center; z-index: 100;
  }
  .loading.show { display: flex; }
  .spinner {
    width: 44px; height: 44px; border: 4px solid var(--blue-050);
    border-top-color: var(--blue-500); border-radius: 50%;
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: var(--blue-900); color: #fff; padding: 12px 20px; border-radius: 24px;
    font-size: 14px; opacity: 0; pointer-events: none; transition: all .25s; z-index: 110;
    max-width: 90%; text-align: center;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.error { background: var(--danger); }

  .empty-hint { color: var(--muted); text-align: center; padding: 30px 0; }
</style>
