<style>
  /* ===== 全体 ===== */
  :root {
    --primary: #3f51b5;
    --primary-dark: #303f9f;
    --bg: #f4f5fa;
    --card: #ffffff;
    --text: #263238;
    --muted: #78909c;
    --border: #e0e4ea;
    --danger: #e53935;
    --radius: 10px;
    --shadow: 0 2px 8px rgba(30, 40, 90, 0.10);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    line-height: 1.6;
  }
  main { max-width: 1000px; margin: 0 auto; padding: 16px; }
  .hidden { display: none !important; }
  .note { color: var(--muted); font-size: 12px; margin: 4px 0 10px; }
  .note.warn { color: #b26a00; }

  /* ===== ヘッダー・タブ ===== */
  .app-header {
    background: var(--primary);
    color: #fff;
    padding: 12px 16px 0;
    box-shadow: var(--shadow);
  }
  .app-header h1 { margin: 0 0 8px; font-size: 18px; }
  .tabs { display: flex; gap: 4px; }
  .tab-btn {
    border: none;
    background: rgba(255, 255, 255, 0.15);
    color: #fff;
    padding: 8px 18px;
    border-radius: 8px 8px 0 0;
    cursor: pointer;
    font-size: 14px;
  }
  .tab-btn.active { background: var(--bg); color: var(--primary); font-weight: bold; }

  .view { display: none; }
  .view.active { display: block; }

  /* ===== ボタン ===== */
  button { font-family: inherit; }
  .primary, .secondary, .danger-btn {
    border: none;
    border-radius: 8px;
    padding: 9px 18px;
    font-size: 14px;
    cursor: pointer;
  }
  .primary { background: var(--primary); color: #fff; }
  .primary:hover { background: var(--primary-dark); }
  .secondary { background: #eceff1; color: var(--text); }
  .danger-btn { background: #ffebee; color: var(--danger); }
  .small-btn { padding: 5px 12px; font-size: 12px; }
  .icon-btn {
    border: 1px solid var(--border);
    background: var(--card);
    border-radius: 8px;
    width: 34px; height: 34px;
    font-size: 18px;
    cursor: pointer;
  }

  /* ===== カレンダー ===== */
  .cal-nav {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 8px 0;
  }
  .cal-nav h2 { margin: 0; font-size: 18px; min-width: 130px; text-align: center; }
  .cal-legend { display: flex; flex-wrap: wrap; gap: 12px; margin: 4px 0 10px; font-size: 12px; color: var(--muted); }
  .cal-legend .legend-item { display: inline-flex; align-items: center; gap: 4px; }
  .mark {
    display: inline-block;
    width: 10px; height: 10px;
    border-radius: 50%;
    flex: none;
  }
  .calendar {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
    background: transparent;
  }
  .cal-loading { grid-column: 1 / -1; text-align: center; padding: 40px 0; color: var(--muted); }
  .cal-dow {
    text-align: center;
    font-size: 12px;
    color: var(--muted);
    padding: 4px 0;
  }
  .cal-dow.sun { color: #e57373; }
  .cal-dow.sat { color: #64b5f6; }
  .cal-cell {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    min-height: 84px;
    padding: 4px 6px;
    cursor: pointer;
    overflow: hidden;
    transition: box-shadow 0.15s;
  }
  .cal-cell:hover { box-shadow: var(--shadow); border-color: var(--primary); }
  .cal-cell.empty { background: transparent; border: none; cursor: default; box-shadow: none; }
  .cal-cell.today { border: 2px solid var(--primary); }
  .cal-daynum { font-size: 13px; font-weight: bold; }
  .cal-cell.sun .cal-daynum { color: #e57373; }
  .cal-cell.sat .cal-daynum { color: #64b5f6; }
  .cal-marks { display: flex; flex-wrap: wrap; gap: 3px; margin: 3px 0; min-height: 10px; }
  .cal-event {
    font-size: 10px;
    color: #4527a0;
    background: #ede7f6;
    border-radius: 4px;
    padding: 0 4px;
    margin-top: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .cal-event-more { font-size: 10px; color: var(--muted); margin-top: 2px; }

  /* ===== モーダル ===== */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(20, 25, 50, 0.5);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    z-index: 100;
  }
  .modal {
    background: var(--card);
    border-radius: var(--radius);
    width: 100%;
    max-width: 640px;
    max-height: 90vh;
    display: flex;
    flex-direction: column;
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.25);
  }
  .modal-small { max-width: 420px; }
  .modal-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
  }
  .modal-head h2 { margin: 0; font-size: 16px; }
  .modal-close {
    border: none; background: none;
    font-size: 22px; cursor: pointer; color: var(--muted);
    line-height: 1;
  }
  .modal-body { padding: 14px 16px; overflow-y: auto; }
  .modal-foot {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    padding: 12px 16px;
    border-top: 1px solid var(--border);
  }

  /* ===== 日次入力フォーム ===== */
  .day-section { margin-bottom: 16px; }
  .day-section h3 {
    margin: 0 0 6px;
    font-size: 13px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .day-events { display: flex; flex-direction: column; gap: 4px; }
  .day-event-item {
    font-size: 12px;
    background: #ede7f6;
    color: #4527a0;
    border-radius: 6px;
    padding: 4px 8px;
  }
  .univ-table { width: 100%; border-collapse: collapse; }
  .univ-table th {
    font-size: 11px; color: var(--muted); font-weight: normal;
    text-align: left; padding: 2px 4px;
  }
  .univ-table td { padding: 2px 4px; }
  .univ-table .period-label { font-size: 12px; color: var(--muted); white-space: nowrap; }
  .univ-table input[type="text"] { width: 100%; }
  .check-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 6px;
    font-size: 14px;
  }
  .check-row input[type="checkbox"] { width: 18px; height: 18px; }
  input[type="text"], input[type="date"], input[type="time"], select, textarea {
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 7px 8px;
    font-size: 13px;
    font-family: inherit;
    background: #fff;
    color: var(--text);
  }
  input:focus, select:focus, textarea:focus { outline: 2px solid #c5cae9; border-color: var(--primary); }
  textarea { width: 100%; resize: vertical; min-height: 52px; }
  .event-add-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .event-add-row input[type="text"] { flex: 1 1 160px; }

  /* ===== タスク ===== */
  .task-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 12px; }
  .task-col-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
  }
  .task-col-head h2 { margin: 0; font-size: 16px; }
  .task-list { display: flex; flex-direction: column; gap: 8px; }
  .task-empty { color: var(--muted); font-size: 13px; padding: 12px; text-align: center; }
  .task-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 10px 12px;
    box-shadow: var(--shadow);
  }
  .task-card.done { opacity: 0.6; }
  .task-card-top { display: flex; align-items: center; gap: 8px; }
  .task-name { font-weight: bold; flex: 1; word-break: break-all; }
  .task-card.done .task-name { text-decoration: line-through; }
  .badge {
    font-size: 11px;
    border-radius: 10px;
    padding: 1px 8px;
    white-space: nowrap;
  }
  .badge.p-high { background: #ffebee; color: #c62828; }
  .badge.p-mid  { background: #fff8e1; color: #b26a00; }
  .badge.p-low  { background: #e8f5e9; color: #2e7d32; }
  .task-meta {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
    margin-top: 6px;
    font-size: 12px;
    color: var(--muted);
  }
  .task-meta select { padding: 3px 6px; font-size: 12px; }
  .task-due.overdue { color: var(--danger); font-weight: bold; }
  .task-actions { margin-left: auto; display: flex; gap: 4px; }
  .task-actions button {
    border: none; background: none; cursor: pointer;
    font-size: 12px; color: var(--muted); padding: 2px 6px;
  }
  .task-actions button:hover { color: var(--primary); }
  .task-actions .del:hover { color: var(--danger); }
  .progress-bar {
    flex: 1 1 100%;
    height: 8px;
    background: #eceff1;
    border-radius: 4px;
    overflow: hidden;
  }
  .progress-bar > div { height: 100%; background: var(--primary); border-radius: 4px; }
  .progress-input { display: flex; align-items: center; gap: 8px; }
  .progress-input input[type="range"] { flex: 1; }
  .progress-val { min-width: 44px; text-align: right; font-size: 13px; }

  /* ===== フォーム共通 ===== */
  .field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; font-size: 12px; color: var(--muted); }
  .field input, .field select { font-size: 14px; color: var(--text); }
  .field-row { display: flex; gap: 10px; }
  .field-row .field { flex: 1; }

  /* ===== 設定 ===== */
  .settings-block {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 16px;
    margin: 12px 0;
    box-shadow: var(--shadow);
  }
  .settings-block h2 { margin: 0 0 4px; font-size: 16px; }
  .category-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 10px; }
  .category-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 4px 0;
    border-bottom: 1px dashed var(--border);
  }
  .category-item input[type="color"] { width: 34px; height: 26px; padding: 0; border: 1px solid var(--border); border-radius: 4px; cursor: pointer; }
  .category-item .cat-name { flex: 1; }
  .category-item .fixed-label { font-size: 11px; color: var(--muted); }
  .category-add { display: flex; gap: 8px; align-items: center; }
  .category-add input[type="color"] { width: 34px; height: 30px; padding: 0; border: 1px solid var(--border); border-radius: 4px; }
  .category-add input[type="text"] { flex: 1; max-width: 240px; }

  .timetable { overflow-x: auto; margin-bottom: 10px; }
  .timetable table { border-collapse: collapse; width: 100%; min-width: 560px; }
  .timetable th, .timetable td { border: 1px solid var(--border); padding: 4px; text-align: center; }
  .timetable th { background: #eef0f8; font-size: 12px; font-weight: normal; }
  .timetable input { width: 100%; min-width: 80px; border: none; padding: 6px 4px; font-size: 13px; }
  .timetable input:focus { outline: 2px solid #c5cae9; }

  /* ===== トースト ===== */
  .toast {
    position: fixed;
    left: 50%;
    bottom: 24px;
    transform: translateX(-50%);
    background: #323232;
    color: #fff;
    padding: 10px 20px;
    border-radius: 8px;
    font-size: 13px;
    box-shadow: var(--shadow);
    z-index: 200;
    max-width: 90vw;
  }
  .toast.error { background: var(--danger); }

  /* ===== スマホ対応 ===== */
  @media (max-width: 640px) {
    .task-cols { grid-template-columns: 1fr; }
    .cal-cell { min-height: 62px; padding: 2px 4px; }
    .cal-event { display: none; }        /* 小画面では予定はドットのみ */
    .cal-cell.has-event .cal-daynum::after {
      content: '•';
      color: #7e57c2;
      margin-left: 2px;
    }
    .field-row { flex-direction: column; gap: 0; }
    main { padding: 10px; }
  }
</style>
